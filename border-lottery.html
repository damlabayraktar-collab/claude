   {label:"Stay in Iran",end:"iranStay"}]},
 van:{year:2023,place:"Iran–Turkey border, near Van",
  text:["The smuggler walks your group over the mountains at night. Turkey has built a wall along much of this border, and soldiers patrol it."],
  fact:"Turkey built a wall about 3 metres high along much of its border with Iran. Rights groups have documented pushbacks of Afghans there. (Human Rights Watch)",
  choices:[{label:"Climb",roll:{p:55,label:"You cross without being caught",
     win:{t:"You walk for 14 hours. At dawn a minibus takes your group towards Istanbul.",money:-1500,safety:-10,next:"istanbulA"},
     lose:{t:"Soldiers catch your group and push you back into Iran. Two weeks later you try again and get through.",money:-2000,safety:-25,next:"istanbulA"}}}]},
 istanbulA:{year:2023,place:"Zeytinburnu, Istanbul",
  text:["You work 12 hours a day in a basement textile workshop and sleep on the floor with six other men. Istanbul is not registering new applicants for international protection. Police stop Afghans in the street."],
  fact:"Turkey deported tens of thousands of Afghans in 2022 and 2023. (Turkish Interior Ministry; Human Rights Watch)",
  choices:[
   {label:"Keep working in Istanbul for now",roll:{p:55,label:"You are not stopped by police",
     win:{t:"Six months without trouble. You save enough to choose your next step.",money:1500,next:"bulgaria"},
     lose:{t:"Police raid the workshop. You are held in a removal centre and put on a charter flight to Kabul.",safety:-20,end:"deportedTr"}}},
   {label:"Go straight on to Bulgaria",next:"bulgaria"}]},
 bulgaria:{year:2023,place:"Turkish–Bulgarian border, Strandzha forest",
  text:["A smuggler wants €3,000 to take you through Bulgaria to Serbia, walking for days through the forest. It is October and the nights are cold."],
  fact:"Rights groups and the Council of Europe have documented violent pushbacks at the Bulgarian–Turkish border.",
  choices:[
   {label:"Go with the smuggler",roll:{p:50,label:"You get through Bulgaria",
     win:{t:"Nine days walking and in the back of cars. You reach Serbia.",money:-3000,safety:-10,next:"germanyA"},
     lose:{t:"Border police take your phone and shoes and push you back into Turkey. You try again a month later and get through.",money:-3500,safety:-25,next:"germanyA"}}},
   {label:"Stay in Istanbul after all",end:"istanbulStay"}]},
 germanyA:{year:2023,place:"Serbia → Hungary → Austria → Germany",
  text:["Through Serbia, a hidden ride across Hungary, a train through Austria. In Passau you walk up to a police officer and say the word you have practised: “Asyl.”"],
  fact:"In 2023 most Afghans who applied for asylum in Germany received some form of protection.",
  choices:[{label:"Wait for your asylum decision",roll:{p:70,label:"You are given protection",
     win:{t:"Your interview goes well. You receive protection.",status:"Protection · Germany",next:"bavaria"},
     lose:{t:"Your asylum claim is refused, but Germany does not deport you either. You get a 'Duldung', a tolerated stay that can end at any time.",status:"Tolerated stay (Duldung) · Germany",next:"bavaria"}}}]},
 bavaria:{year:2024,place:"A small town in Bavaria",
  text:["German classes in the morning, a kitchen job at night. Zainab is now 17 and has been out of school for three years. In August 2024 Germany sends its first deportation flight to Afghanistan since the Taliban took power."],
  fact:"Since 2021 the Taliban have banned girls from school after the sixth grade and women from universities. Afghanistan is the only country in the world with such a ban. (UNESCO)",
  choices:[
   {label:"Apply for an apprenticeship as an electrician",roll:{p:s=>s.status.startsWith("Protection")?65:40,label:"You are accepted (harder with a Duldung)",
     win:{t:"A local firm takes you on. In Germany, an apprenticeship can protect you from deportation while you train.",money:1500,flag:"training",end:"germanyEnd"},
     lose:{t:"The firm says your papers are 'too uncertain'. You keep washing dishes.",end:"germanyEnd"}}},
   {label:"Work double shifts to pay for Zainab's online classes",t:"Every month you send money for a secret online school. Zainab is learning English, like you once did.",sent:2000,ties:10,end:"germanyEnd"}]}
 },
 endings:{
  evacuated:{stamp:s=>s.status.startsWith("Asylee")?"ASYLEE":"PAROLE",tone:s=>s.status.startsWith("Asylee")?"good":"warn",title:"Evacuated to the United States",text:s=>s.status.startsWith("Asylee")?"You were one of about 76,000 Afghans flown to the US in 2021, and one of the lucky ones whose asylum case was decided quickly. You can apply for a green card. Your family is still in Herat.":"You were one of about 76,000 Afghans flown to the US in 2021. Your status is still not settled, and in 2025 US policy towards Afghans hardened sharply. Your luck at the airport gate has not yet turned into security."},
  herat:{mob:{q:"involuntary",note:"Murtaza had reasons to leave, but the journey costs money and puts his family at risk. Some would read his staying as voluntary: he chose family over escape."},stamp:"STAYED",tone:"ink",title:"Staying in Herat",text:"You stay with your family. You teach Zainab English at home in secret. Many people cannot leave, and many choose not to."},
  deportedIran:{stamp:"DEPORTED",tone:"bad",title:"Sent back to Afghanistan",text:"You are back in Herat with nothing, owing money for the journey. Many of the men on the deportation bus say they will try again."},
  iranStay:{mob:{q:"involuntary",note:"Murtaza wanted to go further but stayed in Iran: he was stuck partway along the route."},stamp:"NO STATUS",tone:"bad",title:"Undocumented in Iran",text:"You stay in Tehran, working without papers. In 2025 deportations of Afghans from Iran reach record numbers. Every police car makes you stop breathing."},
  deportedTr:{stamp:"DEPORTED",tone:"bad",title:"Deported to Kabul",text:"You land in Kabul with a plastic bag of belongings, two years and $4,000 after you first left. The journey cost your family everything they had."},
  istanbulStay:{mob:{q:"involuntary",note:"Murtaza was stuck in transit: unable to go back, and too afraid to go on."},stamp:"NO STATUS",tone:"bad",title:"Undocumented in Istanbul",text:"You stay in Istanbul, working in the same basement. You learn enough Turkish to joke with your boss. One police check could end it all."},
  germanyEnd:{stamp:s=>s.status.startsWith("Protection")?"PROTECTED":"TOLERATED",tone:s=>s.status.startsWith("Protection")?"good":"warn",title:s=>s.status.startsWith("Protection")?"Protected in Germany":"Tolerated, not accepted",
   text:s=>s.status.startsWith("Protection")?"You have protection in Germany and a future you can plan for. Zainab, in Herat, cannot study past sixth grade. Your lives are now on two very different paths.":"You live on a Duldung, renewed every few months. "+(s.flags.training?"Your apprenticeship protects you for now.":"Every letter from the immigration office could be a deportation order.")}
 }},

ukraine:{name:"Olena",age:38,from:"Kharkiv, Ukraine",code:"UKR",kind:"Temporary protection",weight:12,
 blurb:"Accountant, 38. Two children; her husband must stay in Ukraine.",
 start:{year:2022,money:3000,safety:80,ties:85,status:"Citizen of Ukraine"},
 prompt:"Ukrainians in the EU had the right to live, work and study within days. Syrians in 2015 waited months or years. Why did Europe respond so differently, and what does that tell us about refugee policy?",
 scenes:{
 start:{year:2022,place:"Kharkiv, 24 February, 5 a.m.",
  text:["Explosions wake you. Russia has invaded. Your children, Sasha (10) and Mila (6), are in your bed. Your husband Andriy is 40: men aged 18 to 60 are not allowed to leave the country."],
  fact:"Within weeks of the invasion, millions of Ukrainians fled abroad, the fastest refugee movement in Europe since the Second World War. (UNHCR)",
  choices:[
   {label:"Leave with the children today",t:"Andriy drives you to the station. You don't know when you'll see him again.",ties:-15,next:"train"},
   {label:"Shelter in the metro and wait",roll:{p:50,label:"Your district avoids heavy shelling",
     win:{t:"Two weeks underground. Mila draws pictures of the trains. Then you decide to leave.",safety:-10,next:"train"},
     lose:{t:"A missile hits the next block. Your windows are blown in. You leave the next morning.",safety:-25,money:-500,next:"train"}}}]},
 train:{year:2022,place:"Lviv → Przemyśl, Poland",
  text:["A free evacuation train, standing room only, 20 hours to the Polish border. At Przemyśl station, volunteers hand out soup, SIM cards and toys."],
  fact:"In March 2022 the EU used its Temporary Protection Directive for the first time. Ukrainians got the right to live, work, study and see a doctor anywhere in the EU immediately, without an asylum process.",
  choices:[
   {label:"Stay in Poland, close to home",status:"Temporary protection · Poland",next:"krakow"},
   {label:"Take a free train on to Berlin",t:"A family in Berlin offers you their spare room. Germany pays higher benefits, but it is further from home and the language is harder.",status:"Temporary protection · Germany",flag:"germany",next:"krakow"}]},
 krakow:{year:2022,place:"Your new city",
  text:["You get your registration number in one day and can work immediately. Your accounting degree needs the local language, so you take a job cleaning hotel rooms. The children can go to the local school in the morning and Ukrainian online school at night."],
  fact:"Poland and Germany each registered more than a million Ukrainians for temporary protection. (Eurostat)",
  choices:[
   {label:"Enrol the children in the local school",t:"Sasha comes home crying in a language he doesn't understand. By spring he is translating for you.",ties:5,flag:"localSchool",next:"andriy"},
   {label:"Keep them in Ukrainian online school only",t:"They keep their grades and their friends from home, but they sit at a laptop all day and don't learn the local language.",ties:-5,next:"andriy"}]},
 andriy:{year:2023,place:"Calls from the front",
  text:["Andriy has been called up. He is at the front near Bakhmut. He calls when he can, sometimes not for a week."],
  choices:[{label:"Wait for news",roll:{p:70,label:"Andriy comes through the year unhurt",
     win:{t:"He calls on Mila's birthday and sings to her over a bad line. He is alive.",next:"returnQ"},
     lose:{t:"Andriy is wounded by shrapnel. He recovers in a hospital in Dnipro, and you travel back to see him for a week.",ties:-10,money:-600,flag:"wounded",next:"returnQ"}}}]},
 returnQ:{year:2023,place:"Summer",
  text:["Kharkiv is calmer this summer. Many people you know are going home. Your mother is alone in the flat."],
  fact:"By 2023 hundreds of thousands of Ukrainians had gone home, while others came and went between Ukraine and the EU. Temporary protection let them move back and forth.",
  choices:[
   {label:"Go back to Kharkiv",next:"kharkiv2"},
   {label:"Stay where you are",next:"stay24"}]},
 kharkiv2:{year:2024,place:"Kharkiv, May",
  text:["In May 2024 Russia opens a new offensive north of Kharkiv. Glide bombs hit the city. Sasha's school moves classes into the metro."],
  choices:[
   {label:"Stay in Kharkiv",roll:{p:70,label:"Your family is not hurt",
     win:{t:"You stay. Life goes on underground and above ground. You work for a firm that pays in hryvnias, not euros.",end:"kharkiv"},
     lose:{t:"A blast shatters Mila's classroom window while she is inside. She is cut but recovers. You leave again for the West.",safety:-30,end:"leftAgain"}}},
   {label:"Leave again for the West",end:"leftAgain"}]},
 stay24:{year:2024,place:"Your new city",
  text:s=>s.flags.germany?["Germany is debating cutting benefits for Ukrainians. You've passed the B1 German exam. An accounting firm says it might hire you if your Ukrainian degree is recognised."]:["Poland now pays its 800-zloty monthly child benefit to Ukrainian families only if the children attend Polish school. An accounting firm says it might hire you if your Ukrainian degree is recognised."],
  fact:"Host countries have gradually linked support for Ukrainians to work and school attendance, as 'temporary' protection has stretched into years.",
  choices:[
   {label:"Apply to have your degree recognised",roll:{p:50,label:"Your degree is recognised",
     win:{t:"Your degree is recognised. You start as a junior accountant, earning twice your cleaning wage.",money:5000,flag:"career",next:"y2025"},
     lose:{t:"The authority wants documents from a university office in Kharkiv that was bombed. You keep cleaning hotel rooms.",next:"y2025"}}},
   {label:"Keep the cleaning job and send money to Andriy",t:"Money for a drone, a sleeping bag, a car for his unit.",sent:2500,next:"y2025"}]},
 y2025:{year:2025,place:"Your new city",
  text:s=>[(s.flags.localSchool?"Sasha speaks the local language like a native and has a girlfriend. ":"The children never learned the local language and want to go home. ")+"The EU extends temporary protection until March 2027. After that, nobody knows."],
  fact:"About 4.3 million people from Ukraine had temporary protection in the EU in 2025. (Eurostat)",
  choices:[
   {label:"Apply for long-term residence where you are",end:"settle"},
   {label:"Plan to go home when the war ends",end:"waiting"}]}
 },
 endings:{
  kharkiv:{mob:{q:"voluntary",note:"Olena had legal protection abroad and chose to go home to a war zone. Returning is also a kind of mobility, and staying there is a choice with real risks."},stamp:"RETURNED",tone:"ink",title:"Back in Kharkiv",text:"You live under the air-raid sirens, in your own flat, near your mother. Andriy comes home on leave twice a year. Returning was your choice, and the risk is yours too."},
  leftAgain:{stamp:"PROTECTED",tone:"stamp",title:"Leaving a second time",text:"You go back west. Your temporary protection is still valid, so you are allowed in the same day. Few refugees in history have been able to move back and forth like this."},
  settle:{stamp:s=>s.flags.career?"SETTLING":"TEMPORARY",tone:s=>s.flags.career?"good":"warn",title:s=>s.flags.career?"Building a life":"Temporary, for now",text:s=>s.flags.career?"With a job as an accountant, you qualify for long-term residence. Your children are growing up between two languages. Andriy says, 'We'll decide when the war is over.'":"Without a qualified job, long-term residence is hard to get. You stay on temporary protection and wait to see what happens in 2027."},
  waiting:{stamp:"WAITING",tone:"warn",title:"Waiting for peace",text:"You keep a suitcase packed in the hall. Your status is temporary. So is your flat, and so, you hope, is the war."}
 }},

honduras:{name:"Luis",age:16,from:"San Pedro Sula, Honduras",code:"HND",kind:"Unaccompanied minor",weight:10,
 blurb:"High school student, 16. A gang wants him as a lookout.",
 start:{year:2018,money:80,safety:30,ties:75,status:"Citizen of Honduras"},
 prompt:"Luis left because of gang violence, but most gang-violence asylum claims in the US fail, because gangs are not 'the state'. Should people fleeing gangs count as refugees?",
 scenes:{
 start:{year:2018,place:"Chamelecón, San Pedro Sula",
  text:["You are 16. Members of a gang (mara) tell you to start working as a lookout. Your cousin Kevin said no last year. He was shot outside his house.","Your mother works in a textile factory. Your father has lived in the United States without papers since you were four."],
  fact:"In the 2010s Honduras had one of the highest murder rates in the world. Gang violence is a major reason people flee northern Central America. (UNODC)",
  choices:[
   {label:"Join the caravan leaving for the US",t:"In October, thousands of people set off together from the bus station. Travelling in a big group feels safer than paying a smuggler.",ties:-10,next:"caravan"},
   {label:"Go to your grandmother's village in Olancho",next:"olancho"},
   {label:"Let your mother borrow $8,000 for a smuggler",tag:"$8,000 debt",t:"Your mother borrows from your father in Houston and a moneylender in town. The smuggler takes you north by bus and truck.",money:-8000,ties:-10,next:"tijuana"}]},
 olancho:{year:2018,place:"Olancho, countryside",
  text:["Your grandmother grows maize and beans. There is no gang in the village, but there is little work and no secondary school nearby."],
  fact:"Many people displaced by violence in Central America move inside their own country first. Honduras has hundreds of thousands of internally displaced people. (IDMC)",
  choices:[{label:"Settle in and help on the farm",roll:{p:50,label:"The gang does not come after you",
     win:{t:"You plant and harvest. Nobody comes. You start to relax.",ties:5,next:"eta"},
     lose:{t:"A motorbike with two men you recognise from Chamelecón stops at the village shop asking for you. You leave that night and join the caravan.",safety:-20,next:"caravan"}}}]},
 eta:{year:2020,place:"Olancho, November",
  text:["Two hurricanes, Eta and Iota, hit Honduras two weeks apart. The floods destroy your grandmother's maize, and her house loses its roof."],
  fact:"Hurricanes Eta and Iota in 2020 affected millions of people in Central America. Disasters and violence often push people to move at the same time.",
  choices:[
   {label:"Stay and rebuild",t:"You and your grandmother rebuild with sheets of zinc from an aid group.",ties:10,next:"olancho2"},
   {label:"Go north",t:"You take a bus to the Guatemalan border with two friends.",next:"caravan"}]},
 olancho2:{year:2022,place:"Olancho",
  text:["You are 20. Your father in Houston sends money for fertiliser. A seasonal farm job programme recruits Hondurans for legal temporary work in the US, on H-2A visas."],
  fact:"Temporary work visas, such as the US H-2A programme for farm workers, offer legal routes but tie workers to one employer and one season.",
  choices:[
   {label:"Apply for a seasonal farm visa",roll:{p:30,label:"You are selected",
     win:{t:"You spend eight months picking blueberries in Georgia, legally. You come home with $7,000.",money:7000,end:"seasonal"},
     lose:{t:"Thousands apply for a few hundred places. You are not chosen.",end:"olanchoStay"}}},
   {label:"Stay and farm",end:"olanchoStay"}]},
 caravan:{year:2018,place:"Tapachula, southern Mexico",
  text:["You cross into Mexico. People along the road hand out water and tortillas. Mexico offers to let some people apply for asylum or a humanitarian visa here."],
  fact:"In 2018 'migrant caravans' of thousands of Central Americans travelled north through Mexico together. Mexico has since become one of the world's largest receivers of asylum claims.",
  choices:[
   {label:"Apply for asylum in Mexico",roll:{p:60,label:"Mexico grants you protection",
     win:{t:"After months of waiting in Tapachula, you get refugee status in Mexico.",status:"Refugee status · Mexico",next:"mexicoLife"},
     lose:{t:"Your case drags on. After a year you lose patience.",next:"tijuana"}}},
   {label:"Keep going to Tijuana",roll:{p:80,label:"You reach Tijuana safely",
     win:{t:"Six weeks of walking, buses and hitchhiking. You reach the border.",safety:-10,next:"tijuana"},
     lose:{t:"Men with guns rob a group of you in Sinaloa. You arrive in Tijuana with nothing.",money:-80,safety:-20,next:"tijuana"}}}]},
 mexicoLife:{year:2020,place:"Monterrey",
  text:["A UN programme helps you move to Monterrey, where factories need workers. You are 18 now."],
  choices:[{label:"Work at an auto parts factory",roll:{p:70,label:"You settle in",
     win:{t:"You earn a steady wage. You send money to your mother.",money:1500,sent:1500,end:"mexico"},
     lose:{t:"Your boss underpays you because you are Honduran. You keep going anyway.",money:600,sent:600,end:"mexico"}}}]},
 tijuana:{year:2018,place:"Tijuana",
  text:["Thousands are waiting here. The US only lets in a few asylum seekers a day. You are 16: a child who arrives alone must be handed to a children's shelter, not held in adult detention."],
  fact:"US law gives special protections to unaccompanied children. About 76,000 unaccompanied children were stopped at the US southern border in 2019. (CBP)",
  choices:[
   {label:"Climb the border fence and hand yourself in as a minor",roll:{p:85,label:"You are treated as a minor",
     win:{t:"Border Patrol takes you to a holding cell, then a children's shelter in Texas.",status:"Unaccompanied minor · USA",next:"shelter"},
     lose:{t:"Officers doubt your age. You spend four nights in a freezing cell before your birth certificate is accepted.",safety:-15,status:"Unaccompanied minor · USA",next:"shelter"}}},
   {label:"Wait in Tijuana for an asylum appointment",t:"In 2019 the US starts sending asylum seekers back to Mexico to wait for their hearings.",next:"mpp"}]},
 mpp:{year:2019,place:"Tijuana",
  text:["Under 'Remain in Mexico', you must wait in Tijuana for your US court date, months away. Tijuana is dangerous for migrants."],
  choices:[{label:"Wait for your court date",roll:{p:20,label:"You win your asylum case",
     win:{t:"Against the odds, a volunteer lawyer helps you win your case.",status:"Asylee · USA",end:"asylum"},
     lose:{t:"You lose your case without a lawyer. Your family tells you not to come home.",next:"tijuana2"}}}]},
 tijuana2:{year:2021,place:"Tijuana",
  text:["You have been waiting in Tijuana for two years. You work at a taco stand and sleep at a shelter run by a church. You are 19. A smuggler offers to take you across the desert in Arizona for $6,000."],
  fact:"Hundreds of people die every year crossing the US–Mexico border, many from heat in the desert. (IOM Missing Migrants Project)",
  choices:[
   {label:"Cross the desert",tag:"Costs $6,000",roll:{p:60,label:"You make it across",
     win:{t:"Three nights walking. You reach Phoenix and take a bus to your father in Houston. You have no papers.",money:-6000,safety:-20,status:"Undocumented · USA",next:"y2025H"},
     lose:{t:"Border Patrol finds your group on the second night. You are deported to Honduras.",money:-6000,safety:-15,status:"Deported to Honduras",end:"deported"}}},
   {label:"Apply for a Mexican work permit and stay",roll:{p:60,label:"You get a permit",
     win:{t:"You get a humanitarian visa and a factory job.",status:"Humanitarian visa · Mexico",money:1000,end:"mexico"},
     lose:{t:"No permit. You stay anyway.",end:"mexicoLimbo"}}}]},
 shelter:{year:2019,place:"A children's shelter in Texas",
  text:["Forty days in a shelter. Then you are released to your father in Houston. A court date for your deportation case arrives in the post."],
  choices:[{label:"Move in with your father",t:"Your father is a stranger to you. He works in roofing and comes home at 9 p.m.",ties:15,next:"houston"}]},
 houston:{year:2020,place:"Houston",
  text:["You go to high school by day and wash dishes at night. A teacher tells you about Special Immigrant Juvenile Status, a route to a green card for young people abused, abandoned or neglected by a parent."],
  fact:"Special Immigrant Juvenile Status can lead to permanent residence, but long backlogs mean many young people wait years for a green card. (USCIS)",
  choices:[
   {label:"Find a free lawyer and apply",roll:{p:50,label:"Your application is approved",
     win:{t:"SIJS approved. You are on a waiting list for a green card.",status:"SIJS approved · USA",next:"y2025H"},
     lose:{t:"Your 18th birthday arrives before your case is filed in the right court.",next:"y2025H"}}},
   {label:"Drop out of school and work full time",t:"You earn $2,000 a month on construction sites and send half home.",money:3000,sent:5000,next:"y2025H"}]},
 y2025H:{year:2025,place:"Houston",
  text:["You are 23. Immigration enforcement in the US expands: raids on workplaces, arrests at courthouses."],
  fact:"In 2025 the US government expanded immigration arrests and deportations, including at immigration court hearings.",
  choices:[{label:"Keep going to work",roll:{p:s=>s.status.startsWith("SIJS")?85:60,label:"You are not detained",
     win:{t:"You keep your head down. Every day without a raid is a good day.",end:"houstonEnd"},
     lose:{t:"Immigration agents detain you at a building site. You are deported to San Pedro Sula, a city you left at 16.",status:"Deported to Honduras",end:"deported"}}}]}
 },
 endings:{
  olanchoStay:{mob:{q:"voluntary",note:"Luis had already moved once, inside Honduras. Staying with his grandmother was a choice, made with few alternatives."},stamp:"STAYED",tone:"ink",title:"Rebuilding in Olancho",text:"You stay and rebuild your grandmother's house. You never left Honduras, but you were still displaced: by a gang first, then by a storm."},
  seasonal:{stamp:"SEASONAL",tone:"good",title:"A legal, temporary route",text:"You go to the US and come back home, legally, every year. Your savings build a house in Olancho. You never got permanent status, but you never had to cross a desert either."},
  mexico:{stamp:"PROTECTED",tone:"good",title:"A life in Mexico",text:"You live in Monterrey with refugee status. Mexico was never your plan, but it is where you are safe and can work legally."},
  mexicoLimbo:{mob:{q:"involuntary",note:"Luis is stuck at the border: the US is a few hundred metres away and closed to him."},stamp:"NO STATUS",tone:"bad",title:"Stuck in Tijuana",text:"You stay in Tijuana without papers, working at a taco stand. The US is a few hundred metres away."},
  asylum:{stamp:"ASYLEE",tone:"good",title:"Granted asylum in the US",text:"You won, one of the few. Most gang-violence asylum claims fail. Without a lawyer, your chances would have been very small."},
  houstonEnd:{stamp:s=>s.status.startsWith("SIJS")?"PENDING":"NO STATUS",tone:s=>s.status.startsWith("SIJS")?"warn":"bad",title:s=>s.status.startsWith("SIJS")?"Waiting for a green card":"Undocumented in Houston",text:s=>s.status.startsWith("SIJS")?"You have SIJS but no green card yet: the waiting list for Hondurans is years long. You have lived in the US for more than a quarter of your life.":"You have no legal status. Houston is home, but it could be taken away any day."},
  deported:{stamp:"DEPORTED",tone:"bad",title:"Back in San Pedro Sula",text:"Seven years after you left, you are back in the city you fled. The gang members you ran from know your face."}
 }},

nigeria:{name:"Chiamaka",age:23,from:"Enugu, Nigeria",code:"NGA",kind:"International student",weight:8,
 blurb:"Microbiology graduate, 23. First-class degree, no job.",
 start:{year:2021,money:4000,safety:75,ties:85,status:"Citizen of Nigeria"},
 prompt:"Chiamaka moved legally, as a student. Her outcome still depended on visa rules that changed several times while she was there. Who are these rules designed for, and who do they leave out?",
 scenes:{
 start:{year:2021,place:"Enugu",
  text:["You finished a microbiology degree with first-class honours and did your year of national service. Since then: no job. Everyone on WhatsApp is talking about 'japa', leaving the country."],
  fact:"In 2022 Nigerians received about 59,000 UK study visas, among the most of any nationality. (UK Home Office)",
  choices:[
   {label:"Apply for a master's in the UK",t:"Your father agrees to sell a plot of land to pay the £16,000 fees.",next:"naira"},
   {label:"Apply for a college program in Canada",roll:{p:40,label:"Your Canadian study permit is approved",
     win:{t:"Approved! You will study for a postgraduate diploma in Halifax.",money:-12000,status:"Study permit · Canada",next:"canada0"},
     lose:{t:"Refused: the officer is 'not satisfied you will leave Canada at the end of your stay'. You apply to the UK instead.",money:-300,next:"naira"}}},
   {label:"Stay and look for work in Lagos",roll:{p:30,label:"You get a lab job",
     win:{t:"A pharmaceutical company in Lagos hires you as a quality control analyst.",money:2000,next:"lagos1"},
     lose:{t:"Six months of applications, no job. You apply to the UK after all.",next:"naira"}}}]},
 lagos1:{year:2022,place:"Lagos",
  text:["Your commute is three hours a day in traffic. Your rent takes almost half your salary. Your cousin in Manchester posts photos of her new car. Your mother says, “Stay, we need you near us.”"],
  choices:[
   {label:"Move closer to work and share a flat",t:"You move to a shared flat near the factory. Less time in traffic, less money saved.",money:-500,ties:-5,next:"lagos2"},
   {label:"Take an evening MBA course",roll:{p:60,label:"Your company pays half",
     win:{t:"The company pays half. You are promoted to supervisor.",money:1000,next:"lagos2"},
     lose:{t:"You pay it all yourself and fall behind on rent.",money:-1500,next:"lagos2"}}}]},
 lagos2:{year:2024,place:"Lagos",
  text:["The naira has crashed. Your salary is worth less than half what it was when you started. Two of your team leaders have left for the UK and Canada. A foreign company offers you a remote job paid in dollars."],
  fact:"When skilled workers leave, their countries lose people they trained. When those workers send money home, start businesses or return, origin countries can also gain. Researchers argue about which effect is bigger.",
  choices:[
   {label:"Take the remote job and stay in Lagos",roll:{p:60,label:"The remote job is stable",
     win:{t:"You earn in dollars and live in Lagos. Your friends abroad are jealous of your rent.",money:6000,end:"lagos"},
     lose:{t:"The company cuts its Nigerian contractors after six months. You go back to your old job.",money:1500,end:"lagos"}}},
   {label:"Start applying for jobs abroad",t:"You start the Canadian application process. It will take at least two years.",end:"lagosLeaving"}]},
 naira:{year:2022,place:"Enugu",
  text:["The naira keeps falling, so your fees cost more in naira every month. The visa needs proof that your family can cover fees and living costs."],
  fact:"The naira lost more than two-thirds of its value against the pound between 2022 and 2024, making study abroad much more expensive for Nigerian families.",
  choices:[{label:"Gather the money",roll:{p:60,label:"Your family raises enough in time",
     win:{t:"The land sale covers it. Your visa is approved.",money:-14000,status:"Student visa · UK",next:"coventry"},
     lose:{t:"You borrow the rest from an uncle at high interest. Your visa is approved.",money:-17000,ties:-5,status:"Student visa · UK",next:"coventry"}}}]},
 coventry:{year:2022,place:"Coventry",
  text:["You may work up to 20 hours a week during term. Rent is £550 a month. You need to start paying your uncle back."],
  fact:"Since January 2024 most international master's students in the UK can no longer bring family members as dependants.",
  choices:[
   {label:"Work 20 hours and focus on your studies",t:"You work in a care home at weekends and get a distinction.",money:3000,flag:"distinction",next:"blackTax"},
   {label:"Take extra cash-in-hand hours",roll:{p:80,label:"Nobody finds out",
     win:{t:"The extra shifts pay your uncle back faster. Your grades suffer.",money:6000,next:"blackTax"},
     lose:{t:"Your employer is raided. Your university is told you broke your visa conditions, and your visa is cancelled.",status:"Visa cancelled",end:"curtailed"}}}]},
 blackTax:{year:2023,place:"Coventry",
  text:["Your younger brother needs ₦600,000 for his university fees. Your mother says, “You are in the UK now.” Your rent is due the same week."],
  fact:"Many migrants support relatives at home even while they struggle themselves. Some call this pressure 'black tax'. Remittances to Nigeria were about $20 billion in 2023. (World Bank)",
  choices:[
   {label:"Send the fees",t:"You skip meals for a month and pick up night shifts. Your brother starts university.",sent:800,money:-800,ties:10,next:"graduate"},
   {label:"Say you can't this time",t:"Your mother goes quiet on the phone. Your brother defers for a year.",ties:-15,next:"graduate"}]},
 graduate:{year:2023,place:"Coventry",
  text:["The Graduate Route lets you stay and work for two years. To stay longer you need a Skilled Worker visa: an employer has to sponsor you. In April 2024 the minimum salary for most jobs rises to £38,700."],
  fact:"In 2024 the UK sharply raised the salary threshold for skilled worker visas, and it closed the care worker route to new overseas recruits in 2025.",
  choices:[
   {label:"Hunt for a lab job with visa sponsorship",roll:{p:s=>s.flags.distinction?35:20,label:"A lab sponsors you (better odds with a distinction)",
     win:{t:"A diagnostics company sponsors your Skilled Worker visa.",money:5000,status:"Skilled Worker visa · UK",end:"skilled"},
     lose:{t:"Two hundred applications. Employers say they 'can't sponsor at the moment'.",next:"care"}}},
   {label:"Switch to a care worker visa",next:"care"},
   {label:"Go home with your UK degree",end:"home"}]},
 care:{year:2024,place:"Midlands",
  text:["A care agency offers to sponsor you as a care worker. The pay is low and your visa depends on the agency keeping its sponsor licence."],
  fact:"The UK revoked hundreds of care sponsors' licences between 2023 and 2025, leaving many migrant care workers with 60 days to find a new sponsor. (UK Home Office)",
  choices:[
   {label:"Take the care job",roll:{p:60,label:"The agency is honest",
     win:{t:"Long shifts, but a steady visa. You start counting towards five years.",money:3000,status:"Health & Care visa · UK",end:"care"},
     lose:{t:"The agency loses its licence. You have 60 days to find another sponsor.",status:"60 days to find a sponsor",end:"limboUK"}}},
   {label:"Go home with your UK degree",end:"home"}]},
 canada0:{year:2022,place:"Halifax, first winter",
  text:["Your first winter. The college is in a converted office block. Most of your classmates are from India and Nigeria. Food prices shock you, and you find out the campus has a food bank."],
  fact:"Some Canadian private colleges grew rapidly on international student fees. Students reported overcrowded housing and growing food bank use. (Canadian government reviews, 2023–24)",
  choices:[
   {label:"Use the food bank and save",t:"You swallow your pride. You save enough to pay back part of your father's land.",money:1500,sent:500,next:"canada"},
   {label:"Work extra hours at a warehouse",roll:{p:75,label:"Your studies don't suffer",
     win:{t:"You manage both. Barely.",money:3000,next:"canada"},
     lose:{t:"You fail a course and pay to retake it.",money:-500,next:"canada"}}}]},
 canada:{year:2023,place:"Halifax",
  text:["Rent is high and there are not many jobs. You share a two-bedroom flat with five other international students. After graduating you can work in Canada for up to three years."],
  fact:"In 2024 Canada capped international student permits and made it harder to get permanent residence, after years of rapid growth.",
  choices:[{label:"Graduate and apply for permanent residence",roll:{p:45,label:"You receive an invitation for permanent residence",
     win:{t:"Your work experience and French course bring your points up. You are invited to apply for permanent residence.",status:"Permanent resident · Canada",end:"canadaPR"},
     lose:{t:"Your points score is too low. Your work permit runs out in 2026.",status:"Work permit · Canada",end:"canadaWait"}}}]}
 },
 endings:{
  lagos:{mob:{q:"voluntary",note:"Chiamaka could imagine leaving and had options, but chose to build a career at home."},stamp:"STAYED",tone:"ink",title:"A career in Lagos",text:"You stay. Half your university friends have gone abroad. Your company is always short of qualified staff."},
  lagosLeaving:{stamp:"APPLYING",tone:"warn",title:"Planning to leave",text:"You have a good job, and you are still planning to leave. Nigerians call it 'japa'. The reason is not that you can't survive at home. You want a future you can plan."},
  curtailed:{stamp:"CANCELLED",tone:"bad",title:"Visa cancelled",text:"You fly home without finishing your degree, still owing your uncle. A small rule broken under money pressure cost you everything you had invested."},
  skilled:{stamp:"SPONSORED",tone:"good",title:"Skilled Worker in the UK",text:"You work in a lab doing the job you trained for. If the rules don't change again, you can settle in the UK in a few years."},
  care:{stamp:"SPONSORED",tone:"warn",title:"Care worker in the UK",text:"You have a first-class science degree and a master's, and you work night shifts in a care home. Your visa depends on your employer."},
  limboUK:{stamp:"60 DAYS",tone:"bad",title:"Sixty days",text:"You are looking for a new sponsor, fast. Without one you must leave the UK, with nothing to show for the debt except a degree."},
  home:{stamp:"RETURNED",tone:"ink",title:"Back home with a UK degree",text:"You go back to Nigeria. Your UK degree helps you get a job at an NGO in Abuja. Your family is still paying off the land sale."},
  canadaPR:{stamp:"RESIDENT",tone:"good",title:"Permanent resident of Canada",text:"You become a permanent resident. In three more years you can apply for citizenship. Your younger sister is already filling in the study permit form."},
  canadaWait:{stamp:"PENDING",tone:"warn",title:"Running out of time",text:"Your work permit ends next year. Canada's rules have tightened just as you finished. You check your points score every week."}
 }},

turkey:{name:"Zeynep",age:27,from:"Ankara, Türkiye",code:"TUR",kind:"Could leave, might stay",weight:8,
 blurb:"Junior doctor, 27. Her friends are learning German. Her parents are getting older.",
 start:{year:2022,money:2500,safety:80,ties:90,status:"Citizen of Türkiye"},
 prompt:"Zeynep's story is about whether to leave, not how. What keeps people in place when they could go? Is staying a decision that needs explaining, just like leaving?",
 scenes:{
 start:{year:2022,place:"A public hospital, Ankara",
  text:["You are in the first year of your residency in internal medicine. Shifts last up to 36 hours. Inflation is over 80%, so your salary buys less every month. Last month a patient's relative attacked a colleague in the emergency room.","Half your medical school WhatsApp group is studying German."],
  fact:"Turkish doctors applying for the certificate needed to work abroad rose from about 60 in 2012 to about 2,700 in 2022. (Turkish Medical Association)",
  choices:[
   {label:"Start German lessons, just in case",t:"Three evenings a week after work. You are always tired.",money:-600,safety:-5,flag:"german",next:"quakeZ"},
   {label:"Focus on your residency",t:"You tell your friends that someone has to stay. You are not sure you believe it.",next:"quakeZ"}]},
 quakeZ:{year:2023,place:"Malatya, February",
  text:["The 6 February earthquakes destroy much of Malatya, where your grandmother lives. She survives, but her house does not. She moves in with your parents in Ankara and needs daily care."],
  fact:"Thousands of health workers volunteered in the earthquake zone in the first weeks. Turkish doctors abroad also organised aid and medical teams.",
  choices:[
   {label:"Volunteer for two weeks in the earthquake zone",t:"You treat crush injuries in a tent hospital in Malatya. You come back changed, and very clear about why you became a doctor.",safety:-10,ties:10,flag:"rooted",next:"offer"},
   {label:"Stay in Ankara and help care for your grandmother",t:"You do night shifts at the hospital and morning shifts at home.",ties:10,next:"offer"}]},
 offer:{year:2023,place:"Ankara",
  text:["A recruiter offers you a job at a clinic in Bavaria: about €4,500 a month, 48-hour weeks, a flat near the hospital. You need a B2 German certificate and must pass a medical language exam."],
  fact:"Germany actively recruits foreign doctors to fill shortages. About one in seven doctors working in Germany trained abroad. (German Medical Association)",
  choices:[
   {label:"Go for it: register for the exams",roll:{p:s=>s.flags.german?65:30,label:"You pass the language exams (much easier if you started German early)",
     win:{t:"You pass. The clinic sends a contract. You could leave in six months.",money:-800,flag:"canGo",next:"decision"},
     lose:{t:"You fail the medical language exam. Next sitting: in eight months.",money:-800,flag:"wanted",next:"decision"}}},
   {label:"Decline: your family needs you here",t:"You tell the recruiter 'not now'. Your mother hugs you longer than usual.",ties:5,flag:"declined",next:"decision"}]},
 decision:{year:2024,place:"Ankara",
  text:s=>s.flags.canGo?["The contract is on your desk. Your grandmother asks, “Will you come back for Bayram?” A senior doctor tells you, “Go. You only live once.” Your best friend has already left."]:s.flags.wanted?["You still want to go, but another exam means another year. Your savings are running low. Your friends post photos from Munich."]:["You finish your residency. Your friends abroad send you job ads every week. You keep closing the tabs."],
  choices:[
   {label:"Sign the contract and go",if:s=>s.flags.canGo,t:"You give your notice. Your colleagues throw you a farewell dinner, and one of them asks for your recruiter's number.",status:"Work permit · Germany",next:"germanyZ"},
   {label:"Tear up the contract and stay",if:s=>s.flags.canGo,next:"stayZ"},
   {label:"Try the exam one more time",if:s=>s.flags.wanted,roll:{p:50,label:"You pass this time",
     win:{t:"You pass. You leave for Bavaria in the spring.",status:"Work permit · Germany",flag:"canGo",next:"germanyZ"},
     lose:{t:"You fail again by two points. You stop trying, for now.",next:"stayZ"}}},
   {label:"Give up on Germany",if:s=>s.flags.wanted,next:"stayZ"},
   {label:"Stay and build your career in Türkiye",if:s=>s.flags.declined,next:"stayZ"}]},
 germanyZ:{year:2025,place:"Rosenheim, Bavaria",
  text:["Your salary is four times what you earned in Ankara. Your patients are mostly elderly Germans, and some ask where you are 'really' from. On video calls your grandmother looks smaller."],
  choices:[
   {label:"Settle in Germany",end:"leftZ"},
   {label:"Plan to go back to Türkiye in a few years",end:"circularZ"}]},
 stayZ:{year:2025,place:"Ankara",
  text:["You finish your residency and become a specialist. A private hospital offers you twice your public salary. You know every street of this city, and your grandmother lives ten minutes away."],
  choices:[
   {label:"Take the private hospital job",money:4000,end:s=>s.flags.wanted&&!s.flags.canGo?"stuckZ":"stayedZ"},
   {label:"Stay in the public hospital",t:"Lower pay, but the patients who need you most.",ties:5,end:s=>s.flags.wanted&&!s.flags.canGo?"stuckZ":"stayedZ"}]}
 },
 endings:{
  leftZ:{stamp:"EMIGRATED",tone:"stamp",title:"A doctor in Bavaria",text:"You become one of the doctors Türkiye trained and Germany employs. You send money for your grandmother's care and fly home twice a year.",mob:{q:"mobility",note:"Zeynep wanted to go and could go: she had a valuable skill, money for exams and a country that wanted her."}},
  circularZ:{stamp:"FOR NOW",tone:"warn",title:"Abroad, for now",text:"You tell everyone it is temporary. Many migrants plan to return 'in a few years'. Some do.",mob:{q:"mobility",note:"Zeynep moved, but plans to return. Migration is often imagined as temporary, even when it turns out not to be."}},
  stayedZ:{stamp:"STAYED",tone:"good",title:s=>s.flags.canGo?"Chose to stay":"Staying, by choice",text:s=>s.flags.canGo?"You had the contract, the exam and the ticket, and you stayed. Your reasons were family, patients and a sense of belonging. Nobody writes news stories about people like you.":"You never really tried to leave. Your friends call it brave, or naive. You call it home.",mob:{q:"voluntary",note:"Zeynep could have left but chose to stay. Researchers call this voluntary immobility. Staying is also a decision with reasons: family care, attachment to place, professional meaning."}},
  stuckZ:{stamp:"STAYED",tone:"warn",title:"Staying, not by choice",text:"You wanted to go and you tried. One exam stood between you and a different life. You make the best of staying, but you still check job ads at night.",mob:{q:"involuntary",note:"Zeynep wanted to move but could not meet the requirements. Even a well-off professional can experience involuntary immobility when a visa or exam blocks the way."}}
 }},

niger:{name:"Fatouma",age:29,from:"Tillabéri region, Niger",code:"NER",kind:"Wants to move, can't",weight:10,
 blurb:"Farmer and mother of three, 29. Drought and armed groups, but no money to leave.",
 start:{year:2019,money:60,safety:40,ties:85,status:"Citizen of Niger"},
 prompt:"Fatouma faced more danger than most people in this game, and she moved the least. Why are the poorest and most vulnerable people often the least able to move? Who is responsible for 'trapped populations'?",
 scenes:{
 start:{year:2019,place:"A village near Tillabéri",
  text:["You are 29, with three children. The millet harvest has failed for the second time in three years. Armed groups have attacked two villages in your district. Your husband Moussa sells his last goat to buy grain."],
  fact:"Most people in the world never move across a border: only about 3.7% of people are international migrants. The poorest households often cannot afford to move at all. (UN DESA; Foresight report, 2011)",
  choices:[
   {label:"Ask Moussa to look for work in Algeria",t:"Moussa leaves with a group of men from the village. He has done seasonal work in Algeria before.",ties:-10,next:"agadez"},
   {label:"Ask to move the whole family to Niamey",roll:{p:20,label:"You can raise enough for the journey and a room",
     win:{t:"Your brother in Niamey agrees to take you in. But first you must sell your land, and nobody is buying.",money:-40,next:"agadez"},
     lose:{t:"Bus fare for five people and a room in the city: you don't have it, and nobody can lend it. You stay.",next:"agadez"}}},
   {label:"Stay and plant again",t:"You plant drought-resistant millet from an aid group and pray for rain.",next:"agadez"}]},
 agadez:{year:2020,place:"Agadez",
  text:["The road north through Agadez used to be busy with buses and trucks taking workers to Algeria and Libya. Since 2015 a law backed by the European Union makes it a crime to transport migrants north. Drivers have been arrested, prices have tripled, and the routes have moved into the open desert."],
  fact:"Niger's Law 2015-36, supported by EU funding, criminalised transporting migrants through the north. Researchers found it made journeys more dangerous and hit the local economy. Niger's military government repealed it in November 2023.",
  choices:[{label:"Wait for news from Moussa",roll:{p:50,label:"Moussa gets through to Algeria",
     win:{t:"Moussa reaches Tamanrasset and finds work on a building site. He sends money twice in six months.",sent:250,next:"attack"},
     lose:{t:"Moussa's driver is stopped. The men are left in Agadez, owing the smuggler. Moussa comes home three months later with nothing.",money:-30,ties:5,next:"attack"}}}]},
 attack:{year:2021,place:"Your village, March",
  text:["Armed men on motorbikes attack a neighbouring village and kill dozens of people. Your village elders say everyone should leave."],
  fact:"In 2021 attacks by armed groups in Niger's Tillabéri region killed hundreds of civilians and forced tens of thousands from their homes. (ACLED; UNHCR)",
  choices:[
   {label:"Flee to the nearest town, Ouallam",t:"You walk 40 km with your children and a donkey cart. You are now an 'internally displaced person'.",safety:5,ties:-10,status:"Internally displaced · Niger",next:"camp"},
   {label:"Stay: the fields are all you have",roll:{p:50,label:"Your village is not attacked",
     win:{t:"The men don't come. But nobody dares go to the far fields, so the harvest is half what it should be.",money:-20,next:"camp2"},
     lose:{t:"They come at night. You hide in the millet with your children. You leave for Ouallam at dawn.",safety:-30,status:"Internally displaced · Niger",next:"camp"}}}]},
 camp:{year:2022,place:"Displacement site, Ouallam",
  text:["You live in a shelter made of plastic sheeting and millet stalks. An aid group distributes food once a month, until funding is cut by half."],
  fact:"People displaced by conflict and disasters usually move only short distances, often to the nearest town. Most never reach another country.",
  choices:[
   {label:"Find work as a cleaner in town",roll:{p:50,label:"You find regular work",
     win:{t:"You clean for a government official's family. Little money, but regular.",money:60,next:"coup"},
     lose:{t:"Too many people are looking for the same jobs. You sell firewood instead.",money:20,next:"coup"}}},
   {label:"Send your 15-year-old son to Niamey to work",t:"He sends a little money. You lie awake thinking about him.",sent:100,ties:-15,flag:"sonGone",next:"coup"}]},
 camp2:{year:2022,place:"Your village",
  text:["Most of your neighbours have left. The school has closed because the teacher fled. You stay with the old people who would not leave."],
  choices:[
   {label:"Keep farming the near fields",t:"You grow just enough to eat, most months.",next:"coup"},
   {label:"Send your 15-year-old son to Niamey to work",t:"He sends a little money. You lie awake thinking about him.",sent:100,ties:-15,flag:"sonGone",next:"coup"}]},
 coup:{year:2023,place:"Niger, July",
  text:["The army takes power in Niamey. West African neighbours close their borders and impose sanctions. Food prices rise sharply. In November the new government repeals the law against transporting migrants."],
  fact:"After the 2023 coup, ECOWAS sanctions and border closures cut off trade, pushing up food prices in Niger. Many Western donors suspended aid. (WFP)",
  choices:[{label:"Get through the year",roll:{p:45,label:"Your family has enough to eat",
     win:{t:"Thin months, but nobody in your family goes hungry.",next:"y2024N"},
     lose:{t:"Your youngest is diagnosed with malnutrition at a clinic. She recovers on emergency food paste.",safety:-15,next:"y2024N"}}}]},
 y2024N:{year:2024,place:"Niger",
  text:s=>[(s.flags.sonGone?"Your son, now 17, calls from Niamey: he wants to go to Algeria. ":"")+"With the 2015 law gone, buses to the north are running openly again. But Algeria regularly rounds up and expels migrants, dropping them in the desert near the border at Assamaka."],
  fact:"Algeria expelled tens of thousands of people to Niger's border in 2023 and 2024, many left to walk 15 km through the desert to Assamaka. (MSF; Alarme Phone Sahara)",
  choices:[
   {label:"Save everything so the family can move to Niamey",roll:{p:30,label:"You get to Niamey",
     win:{t:"After two years of saving, you move into one room in a Niamey neighbourhood. Your children go back to school.",money:-60,end:"niamey"},
     lose:{t:"Prices rise faster than you can save. You stay.",end:"trapped"}}},
   {label:"Let your son try for Algeria",if:s=>s.flags.sonGone,roll:{p:45,label:"Your son finds work and avoids expulsion",
     win:{t:"Your son works on a farm in southern Algeria and sends money home.",sent:300,end:"sonAbroad"},
     lose:{t:"Your son is arrested in a raid and dumped at the border near Assamaka. He walks for a day to reach the town.",end:"sonExpelled"}}},
   {label:"Stay where you are",end:"trapped"}]}
 },
 endings:{
  niamey:{stamp:"INTERNAL",tone:"stamp",title:"To the capital",text:"You moved 120 km in five years. In the statistics you are a tiny dot. For you, it was everything.",mob:{q:"mobility",note:"Fatouma moved, but only a short distance and only after years of trying. For the poorest people, even internal migration takes resources."}},
  trapped:{stamp:"TRAPPED",tone:"bad",title:"Unable to leave",text:"You wanted to leave and you had every reason to. You did not have the money, the documents, the contacts, or someone to look after the children while you went. You are still there.",mob:{q:"involuntary",note:"Fatouma had strong reasons to move (aspiration) but not the means (capability). Researchers call this involuntary immobility; the 2011 Foresight report called such groups 'trapped populations'."}},
  sonAbroad:{stamp:"STAYED",tone:"warn",title:"Your son went instead",text:"You stayed. Your son moved, and his money keeps the family going. Families often choose one person to move, and that person is rarely the mother of young children.",mob:{q:"involuntary",note:"Fatouma stayed while her son moved. Within one household, some people are mobile and others are not. Gender, age and care responsibilities shape who goes."}},
  sonExpelled:{stamp:"EXPELLED",tone:"bad",title:"Back at the start",text:"Your son is home, thinner and silent. The family is poorer than before. He says he'll try again next year.",mob:{q:"involuntary",note:"Fatouma could not move, and her son's attempt was reversed by an expulsion. Policies that block movement can make people more stuck, not less."}}
 }},

tajikistan:{name:"Dilnoza",age:24,from:"Khatlon, Tajikistan",code:"TJK",kind:"Stays behind",weight:8,
 blurb:"Young wife and mother, 24. Her husband works in Moscow nine months a year.",
 start:{year:2019,money:300,safety:75,ties:70,status:"Citizen of Tajikistan"},
 prompt:"Dilnoza never migrated, but migration shaped every year of her life. Should people 'left behind' be part of what we study as migration? Who in your own family stayed while someone else moved?",
 scenes:{
 start:{year:2019,place:"A village in Khatlon",
  text:["You are 24. Your husband Farrukh works on building sites in Moscow nine months of the year. You live with his parents, as is the custom, and look after your two children and your mother-in-law, who has diabetes.","Almost every family on your street has a man in Russia."],
  fact:"Money sent home by migrants equals almost half of Tajikistan's GDP, one of the highest shares in the world. (World Bank)",
  choices:[
   {label:"Ask Farrukh if you can join him in Moscow",roll:{p:25,label:"Your in-laws agree",
     win:{t:"Your in-laws reluctantly agree you can go next year, if your sister-in-law takes over the housework.",flag:"maybeGo",next:"covidT"},
     lose:{t:"Your mother-in-law refuses: who will look after her and the children? Farrukh does not argue with his mother.",ties:-5,next:"covidT"}}},
   {label:"Use Farrukh's money to start a sewing business",t:"You buy a sewing machine and make dresses for weddings in the village.",money:-200,flag:"sewing",next:"covidT"}]},
 covidT:{year:2020,place:"Khatlon",
  text:["COVID-19. Russia closes its borders. Farrukh is stuck in Moscow with no work, and no money comes home for four months."],
  fact:"Remittances to Central Asia fell sharply in 2020 as migrants in Russia lost work, then recovered. Families who depended on them had few other options. (World Bank)",
  choices:[{label:"Manage without his money",roll:{p:s=>s.flags.sewing?70:40,label:"Your family gets by (easier with your own income)",
     win:{t:s=>s.flags.sewing?"Your sewing keeps food on the table. Your father-in-law looks at you differently now.":"Your parents help, and the garden feeds you.",ties:5,next:"war"},
     lose:{t:"You borrow from a neighbour and sell your wedding gold.",money:-150,next:"war"}}}]},
 war:{year:2022,place:"Khatlon",
  text:["Russia invades Ukraine. The rouble crashes, then recovers. Farrukh hears that the Russian army is offering migrants fast-track citizenship and big payments if they sign a contract to fight."],
  fact:"Russia offered foreign migrant workers money and fast-track citizenship to join its army in Ukraine. Central Asian governments warned their citizens against it.",
  choices:[
   {label:"Beg him to come home",roll:{p:60,label:"He listens",
     win:{t:"Farrukh says no to the recruiters and stays on the building site.",next:"crocus"},
     lose:{t:"Farrukh says he will 'think about it'. You don't sleep for a week. In the end he does not sign, but a man from your village does.",safety:-10,next:"crocus"}}},
   {label:"Leave it to him",t:"He doesn't sign. A man from the next village does. His family receives a coffin in 2023.",safety:-5,next:"crocus"}]},
 crocus:{year:2024,place:"Khatlon, March",
  text:["Gunmen attack the Crocus City Hall concert hall near Moscow and kill more than 140 people. The suspects are Tajik citizens. Police in Russia raid migrant hostels and building sites. Farrukh is stopped four times in one week."],
  fact:"After the March 2024 attack, Tajik migrants in Russia faced raids, detentions, expulsions and stricter rules. Many began looking for work in other countries. (Human Rights Watch)",
  choices:[{label:"Wait for news",roll:{p:55,label:"Farrukh keeps his job and permit",
     win:{t:"Farrukh keeps his head down and his job. He sends less money home because he's paying bribes at checkpoints.",sent:600,next:"choiceT"},
     lose:{t:"Farrukh is deported and banned from entering Russia for five years. He comes home angry and without work.",flag:"banned",ties:5,next:"choiceT"}}}]},
 choiceT:{year:2025,place:"Khatlon",
  text:s=>[s.flags.banned?"Farrukh is home and can't go back to Russia. He talks about South Korea or Europe, but you need a lot of money for that.":"Farrukh is still in Moscow. Your children are 8 and 6 and barely know their father.","A recruitment agency in Dushanbe is hiring women for seasonal fruit picking in the UK. You have never been further than Dushanbe."],
  fact:"More and more Central Asian women are migrating for work, including on seasonal visa schemes in the UK and South Korea. (IOM)",
  choices:[
   {label:"Apply for the UK seasonal worker visa yourself",roll:{p:35,label:"You are selected",
     win:{t:"You fly to Kent in May to pick strawberries for six months. Your in-laws look after the children.",status:"Seasonal worker visa · UK",end:"sheGoes"},
     lose:{t:"The agency wants a $1,500 'fee'. You realise it is not legal, and you don't go.",end:"stayT"}}},
   {label:"Stay with the children",end:"stayT"},
   {label:s=>s.flags.banned?"Save for Farrukh to try South Korea":"Ask Farrukh to come home for good",end:"homeT"}]}
 },
 endings:{
  sheGoes:{stamp:"SEASONAL",tone:"stamp",title:"Your turn to move",text:"For the first time, you are the one who migrates. You send money home to your husband. Your mother-in-law tells everyone in the village you are 'visiting relatives'.",mob:{q:"mobility",note:"Dilnoza moved when an opportunity came. Her aspiration to move was there all along; she lacked the means and the family's permission."}},
  stayT:{stamp:"STAYED",tone:"ink",title:"The one who stays",text:s=>"You stayed in the village, as you did every year. "+(s.flags.sewing?"Your sewing business now employs two other women whose husbands are in Russia. ":"")+"Your life was shaped by migration at every turn, though you never crossed a border.",mob:{q:"acquiescent",note:"Dilnoza stayed. Did she want to? Was she able to? When people neither strongly want to move nor can, Kerilyn Schewel calls it 'acquiescent immobility'. Others would say her wishes were never asked."}},
  homeT:{stamp:"TOGETHER",tone:"good",title:"Together, for now",text:"Farrukh comes home. Your family is together, and poorer. The children have to get used to their father. Within a year, he is talking about leaving again.",mob:{q:"voluntary",note:"The family chose to stay together rather than depend on migration. But without other jobs nearby, this voluntary immobility is fragile."}}
 }}
};

/* ---------- state ---------- */
let S=null, view={screen:"home"};
const fmt=n=>(n<0?"−$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
const clamp=v=>Math.max(0,Math.min(100,v));
const val=(x,s)=>typeof x==="function"?x(s):x;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function draw(){const ids=Object.keys(PROFILES);let tot=ids.reduce((a,k)=>a+PROFILES[k].weight,0),r=Math.random()*tot;
  for(const k of ids){r-=PROFILES[k].weight;if(r<=0)return k}return ids[0]}
function begin(id){const p=PROFILES[id];S={pid:id,...structuredClone(p.start),startYear:p.start.year,sent:0,flags:{},log:[],scene:"start",choices:0,rolls:0,lucky:0};
  view={screen:"intro"};render()}
function scene(){return PROFILES[S.pid].scenes[S.scene]}

function apply(e){const d=[];
  if(e.fee){S.money-=1100;d.push(["Agent fee −$1,100","down"])}
  if(e.money){S.money+=e.money;d.push([`Money ${e.money>0?"+":"−"}$${Math.abs(e.money).toLocaleString("en-US")}`,e.money>0?"up":"down"])}
  if(e.sent){S.sent+=e.sent;d.push([`Sent home +$${e.sent.toLocaleString("en-US")}`,"up"])}
  if(e.safety){S.safety=clamp(S.safety+e.safety);d.push([`Safety ${e.safety>0?"+":"−"}${Math.abs(e.safety)}`,e.safety>0?"up":"down"])}
  if(e.ties){S.ties=clamp(S.ties+e.ties);d.push([`Family & ties ${e.ties>0?"+":"−"}${Math.abs(e.ties)}`,e.ties>0?"up":"down"])}
  if(e.status&&e.status!==S.status){S.status=e.status;d.push([`Status: ${e.status}`,"st"])}
  if(e.flag)S.flags[e.flag]=true;
  return d}

function choose(i){const sc=scene(),c=visibleChoices(sc)[i];let eff=c,rollInfo=null;
  S.choices++;
  if(c.roll){const p=val(c.roll.p,S),r=1+Math.floor(Math.random()*100),ok=r<=p;S.rolls++;if(ok)S.lucky++;
    rollInfo={p,r,ok,label:c.roll.label};eff={...c,...(ok?c.roll.win:c.roll.lose)};delete eff.roll}
  const deltas=apply(eff);
  S.log.push({year:sc.year,choice:val(c.label,S),roll:rollInfo});
  view={screen:"outcome",text:val(eff.t,S)||"",roll:rollInfo,deltas,next:eff.next,end:val(eff.end,S),choiceLabel:val(c.label,S)};render()}
function visibleChoices(sc){return sc.choices.filter(c=>!c.if||c.if(S))}
function cont(){if(view.end){S.ending=view.end;view={screen:"end"}}else{S.scene=view.next;view={screen:"scene"}}render();window.scrollTo({top:0})}

/* ---------- views ---------- */
const app=document.getElementById("app");
function header(){const p=PROFILES[S.pid],sc=S.scene&&view.screen!=="end"?scene():null;const yr=sc?sc.year:Math.max(S.startYear,...S.log.map(l=>l.year));
  return `<header class="filehead"><div class="idline"><h2>${esc(p.name)}, ${p.age+(yr-S.startYear)}</h2><span class="mono">${yr} · ${esc(sc?sc.place:"Where life led")}</span></div>
  <div class="meters">
   <div class="meter"><span class="label">Money</span><span class="v" style="color:${S.money<0?"var(--bad)":"inherit"}">${fmt(S.money)}</span></div>
   <div class="meter"><span class="label">Sent home</span><span class="v">${fmt(S.sent)}</span></div>
   <div class="meter"><span class="label">Safety</span><div class="bar"><i style="width:${S.safety}%"></i></div></div>
   <div class="meter"><span class="label">Family & ties</span><div class="bar"><i style="width:${S.ties}%"></i></div></div>
  </div><span class="status">${esc(S.status)}</span></header>`}

function homeView(){
 const lives=Object.entries(PROFILES).map(([k,p])=>`<button class="life" data-pick="${k}"><span class="label">${esc(p.kind)}</span><b>${esc(p.name)} · ${esc(p.from)}</b><span>${esc(p.blurb)}</span></button>`).join("");
 return `<section class="hero fade">
  <span class="label">A migration simulation · thirteen lives · about 10 minutes each</span>
  <h1>The Border <span>Lottery</span></h1>
  <p class="lede">You don't choose where you are born, which passport you hold, or the year a war or a flood arrives. You do make choices after that. Draw a life and see which parts were up to you.</p>
  <div class="figs">
   <div class="fig"><b>304 M</b><small>people live outside their country of birth (UN DESA, 2024)</small></div>
   <div class="fig"><b>123 M</b><small>people forcibly displaced, end of 2024 (UNHCR)</small></div>
   <div class="fig"><b>$685 B</b><small>sent home to low- and middle-income countries, 2024 (World Bank)</small></div>
  </div>
  <div class="btnrow"><button class="btn" id="drawBtn">Draw a random life</button><a class="btn ghost" href="#lives" style="text-decoration:none">Choose a life</a></div>
 </section>
 <section class="sheet" id="lives"><div><span class="label">Thirteen lives</span><h3 style="font-size:24px;margin-top:4px">Choose one, or let chance decide</h3></div>
  <p style="font-size:15.5px;color:var(--muted)">The random draw is weighted roughly by how common each kind of move is: labour migration and internal displacement come up more often than moving abroad for the sunshine. Three lives (Zeynep, Fatouma and Dilnoza) are about staying rather than leaving. Teachers can assign lives so the class covers all of them.</p>
  <div class="lives">${lives}</div></section>
 ${teacherGuide()}`}

function teacherGuide(){return `<details class="teacher" id="teacher"><summary>Teacher guide: a 20-minute lesson</summary><div class="tbody">
 <dl class="plan">
  <dt>Tip</dt><dd>If you have a longer class, play two lives with contrasting passports (for example Ukraine and Syria, or the UK and Nepal) and compare them.</dd>
  <dt>0–3 min</dt><dd>Ask: “How many countries can your passport enter without a visa?” Explain the rules: everyone draws one life, reads carefully, and makes decisions as that person. When a choice involves chance, the dice roll shows the odds.</dd>
  <dt>3–13 min</dt><dd>Students play one life (8–12 minutes) on a phone or laptop, alone or in pairs. Assign lives so the class covers different kinds of moves and stays; pairs reading together tend to discuss more.</dd>
  <dt>13–15 min</dt><dd>Pair up with someone who had a different life. Compare life cards: the stamp, the passport bar, and how many outcomes were decided by dice.</dd>
  <dt>15–20 min</dt><dd>Whole-class debrief. Tally the end stamps on the board (Citizen, Protected, Pending, Returned, No status…) and use two or three questions below.</dd>
 </dl>
 <div><span class="label">Debrief questions</span></div>
 <ol>
  <li>Which moments in your life were choices, and which were luck? Were the choices really free?</li>
  <li>Which law or policy changed your outcome most? Who made that rule, and who was it designed for?</li>
  <li>What would a newspaper call your person: refugee, migrant, expat, worker, illegal? Who decides the label, and what does it change?</li>
  <li>Push and pull factors: did your person fit the model, or did several causes overlap (war, money, family, climate)?</li>
  <li>Compare passports: how much did your person's passport decide before they made any choice?</li>
  <li>Use the aspiration–capability grid on the life card: was your person mobile, or voluntarily, involuntarily or acquiescently immobile? Do classmates agree?</li>
  <li>Most people never cross a border. Why do migration studies focus on people who move? What do we miss when we ignore people who stay?</li>
 </ol>
 <div><span class="label">Key concept: immobility</span></div>
 <p>Migration theory now asks why people stay as well as why they move. The <b>aspiration–capability</b> approach separates whether a person wants to move from whether they can (Carling, 2002; de Haas, 2021). That gives four outcomes: mobility, <b>involuntary immobility</b> (wants to, can't), <b>voluntary immobility</b> (can, doesn't want to) and <b>acquiescent immobility</b> (neither; Schewel, 2020). Every life card ends with this grid. Zeynep (could leave, might stay), Fatouma (trapped by poverty and danger) and Dilnoza (stays behind while her husband migrates) were written around it.</p>
 <p class="src">Carling, J. (2002) Migration in the age of involuntary immobility, <i>Journal of Ethnic and Migration Studies</i> 28(1). Schewel, K. (2020) Understanding immobility, <i>International Migration Review</i> 54(2). de Haas, H. (2021) A theory of migration: the aspirations-capabilities framework, <i>Comparative Migration Studies</i> 9. Foresight (2011) <i>Migration and Global Environmental Change</i>, UK Government Office for Science.</p>
 <p class="src"><b>About the numbers.</b> Stories are composites, not real individuals. Facts shown in the purple boxes come from the sources named. The odds on dice rolls are teaching estimates informed by those sources, not measured probabilities. Passport figures are approximate visa-free counts from the Henley Passport Index, 2025.
 Main sources: UN DESA International Migrant Stock 2024; UNHCR Global Trends 2025; IOM World Migration Report and Missing Migrants Project; IDMC Global Report on Internal Displacement 2025; World Bank Migration and Development Briefs; ILO; R4V.</p>
</div></details>`}

function introView(){const p=PROFILES[S.pid],pp=PASSPORTS.find(x=>x[1]===p.code);
 return `<section class="sheet fade"><span class="label">Your life has been drawn</span>
  <h3 style="font-size:clamp(34px,8vw,48px)">You are ${esc(p.name)}.</h3>
  <dl class="passport">
   <dt>Born in</dt><dd>${esc(p.from)}</dd>
   <dt>Age</dt><dd>${p.age} in ${p.start.year}</dd>
   <dt>Story</dt><dd>${esc(p.blurb)}</dd>
   <dt>Passport</dt><dd>Visa-free entry to about <b>${pp[2]}</b> countries</dd>
   <dt>Savings</dt><dd>${fmt(p.start.money)}</dd>
  </dl>
  <p style="font-size:16px;color:var(--muted)">Make each decision as ${esc(p.name)} would, with what ${esc(p.name)} knows at the time. Watch four things: money, money sent home, safety, and family ties. Your legal status is the stamp under them.</p>
  <div class="btnrow"><button class="btn" id="beginBtn">Begin</button><button class="btn ghost" id="homeBtn">Back</button></div></section>`}

function sceneView(){const sc=scene();
 const ch=visibleChoices(sc).map((c,i)=>`<button class="choice" data-i="${i}"><span class="box"></span><span class="t"><b>${esc(val(c.label,S))}</b>${c.roll||c.tag?`<span class="tag">${[c.tag,c.roll?"Chance involved":""].filter(Boolean).join(" · ")}</span>`:""}</span></button>`).join("");
 return header()+`<section class="sheet scene fade"><span class="label">${sc.year} · ${esc(sc.place)}</span>
  <div class="story">${val(sc.text,S).map(t=>`<p>${esc(t)}</p>`).join("")}</div>
  ${sc.fact?`<aside class="fact"><span class="label">On the record</span>${esc(sc.fact)}</aside>`:""}
  <div class="choices">${ch}</div></section>`}

function outcomeView(){const v=view,r=v.roll;
 const roll=r?`<div class="roll"><span class="label">Chance: ${r.p}% · ${esc(r.label)}</span>
   <div class="track"><div class="win" style="width:${r.p}%"></div><div class="mark" id="mark" data-n="${r.r}"></div></div>
   <div class="scale"><span>1</span><span>roll</span><span>100</span></div>
   <span class="verdict ${r.ok?"ok":"no"}" id="verdict" style="opacity:0">You rolled ${r.r}. ${r.ok?"It went your way.":"It did not go your way."}</span></div>`:"";
 const d=v.deltas.map(([t,c])=>`<span class="delta ${c}">${esc(t)}</span>`).join("");
 return header()+`<section class="sheet fade"><span class="label">You chose</span><h3 style="font-size:24px">${esc(v.choiceLabel)}</h3>
  ${roll}<div class="story" id="otext" ${r?'style="opacity:0;transition:opacity .4s"':""}>${v.text?`<p>${esc(v.text)}</p>`:""}${d?`<div class="deltas">${d}</div>`:""}</div>
  <div class="btnrow"><button class="btn" id="contBtn" ${r?'style="visibility:hidden"':""}>${v.end?"See how your life turned out":"Continue"}</button></div></section>`}

const QUAD={
 mobility:["Mobility","wanted + able","The person wanted to move and had the means to do it: money, documents, contacts, health, permission."],
 involuntary:["Involuntary immobility","wanted + not able","The person wanted to move but could not: no money, no visa, no network, care duties, or a border in the way (Carling, 2002). Very poor groups facing environmental risk are sometimes called 'trapped populations' (Foresight, 2011)."],
 voluntary:["Voluntary immobility","able + did not want","The person could have moved but chose to stay, because of family, attachment to place, work, faith or identity. Staying is also a decision with reasons (Schewel, 2020)."],
 acquiescent:["Acquiescent immobility","neither","The person neither strongly wanted to move nor was able to. Staying was taken for granted, or other people decided (Schewel, 2020)."]};
function qcell(k){return `<button class="qcell" data-q="${k}"><b>${QUAD[k][0]}</b><small>${QUAD[k][1]}</small></button>`}
function endView(){const p=PROFILES[S.pid],e=p.endings[S.ending],tone=val(e.tone,S),stamp=val(e.stamp,S);
 const lastYear=Math.max(...S.log.map(l=>l.year),S.startYear);
 const name=p.name.toUpperCase();
 const l1=("P<"+p.code+name+"<<"+stamp.replace(/[^A-Z]/g,"<")).padEnd(44,"<").slice(0,44);
 const l2=(p.code+S.startYear+"<"+lastYear+"<"+String(S.rolls).padStart(2,"0")+"R"+String(S.lucky).padStart(2,"0")+"L").padEnd(44,"<").slice(0,44);
 const tl=S.log.map(l=>`<li><span class="y">${l.year}</span><span class="k ${l.roll?(l.roll.ok?"c-good":"c-bad"):"c-stamp"}" title="${l.roll?"Chance":"Your choice"}">${l.roll?(l.roll.ok?"✓":"✗"):"●"}</span><span>${esc(l.choice)}${l.roll?` <span class="mono" style="font-size:12px;color:var(--muted)">(${l.roll.p}% chance, rolled ${l.roll.r})</span>`:""}</span></li>`).join("");
 const pp=PASSPORTS.map(([n,c,v])=>`<div class="pprow ${c===p.code?"me":""}"><span>${n}</span><div class="bar"><i style="width:${v/195*100}%"></i></div><span class="n">${v}</span></div>`).join("");
 return header()+`<section class="sheet fade"><span class="label">${S.startYear}–${lastYear} · Life card</span>
  <div class="stampbox"><div class="bigstamp c-${tone}">${esc(stamp)}<small>${esc(S.status)}</small></div></div>
  <h3 style="font-size:clamp(28px,7vw,40px)">${esc(val(e.title,S))}</h3>
  <div class="story"><p>${esc(val(e.text,S))}</p></div>
  <div class="mrz" aria-label="Machine-readable summary">${esc(l1)}\n${esc(l2)}</div>
  <div class="tally">
   <div><span class="label">Decisions you made</span><b>${S.choices}</b></div>
   <div><span class="label">Dice rolls that went your way</span><b>${S.lucky} of ${S.rolls}</b></div>
   <div><span class="label">Money at the end</span><b>${fmt(S.money)}</b></div>
   <div><span class="label">Sent home</span><b>${fmt(S.sent)}</b></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px"><span class="label">Your path · ● choice · ✓/✗ chance</span><ul class="timeline">${tl}</ul></div>
  <div class="pp"><span class="label">Before any choice: countries each passport enters visa-free (approx., Henley 2025)</span>${pp}</div>
  <aside class="fact"><span class="label">Discuss</span><span class="prompt">${esc(p.prompt)}</span></aside>
  <div class="quadwrap"><span class="label">Mobility and immobility · aspiration and capability</span>
   <p style="font-size:16px">At the end of this life, where would you place ${esc(p.name)}? Tap a box.</p>
   <div class="quad">
    <span></span><span class="ax">Able to move</span><span class="ax">Not able to move</span>
    <span class="ax">Wanted to move</span>${qcell("mobility")}${qcell("involuntary")}
    <span class="ax">Did not want to move</span>${qcell("voluntary")}${qcell("acquiescent")}
   </div>
   <div class="qout" id="qout" aria-live="polite"></div></div>
  <div class="btnrow"><button class="btn" id="againBtn">Draw another life</button><button class="btn ghost" id="homeBtn">Back to start</button></div></section>`}

function render(){
 const s=view.screen;
 app.innerHTML=s==="home"?homeView():s==="intro"?introView():s==="scene"?sceneView():s==="outcome"?outcomeView():endView();
 const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f};
 on("drawBtn",()=>begin(draw()));
 on("beginBtn",()=>{view={screen:"scene"};render();window.scrollTo({top:0})});
 on("homeBtn",()=>{S=null;view={screen:"home"};render();window.scrollTo({top:0})});
 on("againBtn",()=>{const cur=S.pid;let n=draw(),g=0;while(n===cur&&g++<20)n=draw();begin(n);window.scrollTo({top:0})});
 on("contBtn",cont);
 app.querySelectorAll(".qcell").forEach(b=>b.onclick=()=>{const k=b.dataset.q,e=PROFILES[S.pid].endings[S.ending],m=e.mob;
  app.querySelectorAll(".qcell").forEach(x=>x.classList.toggle("sel",x===b));
  if(m)app.querySelectorAll(".qcell").forEach(x=>x.classList.toggle("reading",x.dataset.q===m.q));
  document.getElementById("qout").innerHTML=`<p><b>${QUAD[k][0]}.</b> ${esc(QUAD[k][2])}</p>`+(m?`<p class="r"><span class="label">One reading of this ending · ${QUAD[m.q][0]}</span><br>${esc(m.note)}</p>`:`<p class="r">There is no single right answer here. Defend your choice to your partner: what did ${esc(PROFILES[S.pid].name)} want, and what made moving possible or impossible?</p>`)});
 app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{begin(b.dataset.pick);window.scrollTo({top:0})});
 app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
 if(s==="outcome"&&view.roll){const m=document.getElementById("mark"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const show=()=>{["verdict","otext"].forEach(id=>{const el=document.getElementById(id);if(el)el.style.opacity=1});const b=document.getElementById("contBtn");if(b)b.style.visibility="visible"};
  if(reduce){m.style.left=`calc(${view.roll.r}% - 1.5px)`;show()}
  else{requestAnimationFrame(()=>requestAnimationFrame(()=>{m.style.left=`calc(${view.roll.r}% - 1.5px)`}));setTimeout(show,1150)}}
}

function boot(data){if(data&&data.S){S=data.S;view=data.view}render()}
window.claude?.hot?.snapshot?.(()=>({S,view}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
