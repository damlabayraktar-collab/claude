<style>
/* Layout: one column "case file" on security-paper ground; stamps carry outcomes, mono carries the paperwork. */
:root{
  --paper:#E8EDEB; --sheet:#F8FAF9; --ink:#17212C; --muted:#56636E; --rule:#C6D0CD;
  --stamp:#4B3897; --stamp-soft:#E7E2F6; --good:#1D6B50; --warn:#8F5B00; --bad:#A12F2F;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1218; --sheet:#141B23; --ink:#E3E8EB; --muted:#95A2AD; --rule:#2B3641;
  --stamp:#A898EE; --stamp-soft:#262140; --good:#5FC99F; --warn:#E3AB4E; --bad:#EF7E7E; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1218; --sheet:#141B23; --ink:#E3E8EB; --muted:#95A2AD; --rule:#2B3641;
  --stamp:#A898EE; --stamp-soft:#262140; --good:#5FC99F; --warn:#E3AB4E; --bad:#EF7E7E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  background-image:repeating-linear-gradient(135deg, color-mix(in srgb,var(--rule) 35%,transparent) 0 1px, transparent 1px 9px);}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.mono{font-family:var(--mono)}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:22px clamp(16px,4vw,30px);
  display:flex;flex-direction:column;gap:16px;min-width:0}

/* home */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.hero h1{font-size:clamp(44px,11vw,84px);font-weight:800;letter-spacing:-.025em}
.hero h1 span{color:var(--stamp)}
.lede{font-size:19px;max-width:60ch}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.fig{background:var(--sheet);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig b{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.fig small{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.35}
@media (max-width:520px){.figs{grid-template-columns:1fr}}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--sheet);padding:12px 20px;border-radius:3px;cursor:pointer;
  font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{background:var(--stamp);border-color:var(--stamp);color:var(--sheet)}
.btn.ghost:hover{background:var(--stamp-soft);color:var(--ink);border-color:var(--ink)}
.lives{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.life{border:1px solid var(--rule);background:var(--sheet);border-radius:3px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.life:hover{border-color:var(--stamp)}
.life b{font-family:var(--display);font-size:18px}
.life span{font-size:14px;color:var(--muted);line-height:1.35}
details.teacher{background:var(--sheet);border:1px solid var(--rule);border-radius:4px}
details.teacher>summary{cursor:pointer;padding:16px 20px;font-family:var(--display);font-weight:700;font-size:20px;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.teacher>summary::after{content:"+";font-family:var(--mono);color:var(--stamp)}
details.teacher[open]>summary::after{content:"−"}
.tbody{padding:0 clamp(16px,4vw,26px) 22px;display:flex;flex-direction:column;gap:14px;font-size:16px}
.plan{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.plan dt{font-family:var(--mono);font-size:13px;color:var(--stamp);font-weight:600;padding-top:2px;font-variant-numeric:tabular-nums}
.plan dd{margin:0}
.tbody ol,.tbody ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.src{font-size:14px;color:var(--muted)}
.src a{color:var(--stamp)}

/* file header */
.filehead{display:flex;flex-direction:column;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--paper);padding-block:10px 12px;border-bottom:2px solid var(--ink)}
.idline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;align-items:baseline}
.idline h2{font-size:22px;font-weight:700}
.idline .mono{font-size:13px;color:var(--muted)}
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.meters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.meter{display:flex;flex-direction:column;gap:3px;min-width:0}
.meter .v{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .5s ease}
.status{font-family:var(--mono);font-size:12.5px;border:1.5px solid var(--stamp);color:var(--stamp);padding:3px 8px;border-radius:2px;align-self:flex-start;letter-spacing:.03em}

.scene h3{font-size:clamp(26px,6vw,34px);font-weight:700}
.story{display:flex;flex-direction:column;gap:12px;font-size:18px;max-width:62ch}
.fact{border-left:3px solid var(--stamp);background:var(--stamp-soft);padding:10px 14px;font-size:15px;line-height:1.45;display:flex;flex-direction:column;gap:4px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer;background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;padding:13px 15px}
.choice:hover{background:var(--stamp-soft)}
.choice .box{flex:none;width:18px;height:18px;border:2px solid var(--ink);margin-top:3px}
.choice .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.choice .t b{font-weight:600}
.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--stamp);text-transform:uppercase}

/* roll */
.roll{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--stamp);border-radius:3px;padding:14px}
.track{position:relative;height:30px;border:1.5px solid var(--ink);border-radius:2px;overflow:visible;background:color-mix(in srgb,var(--bad) 14%,var(--sheet))}
.track .win{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--good) 28%,var(--sheet));border-right:2px solid var(--good)}
.track .mark{position:absolute;top:-7px;bottom:-7px;width:3px;background:var(--ink);left:0;transition:left 1.1s cubic-bezier(.2,.8,.2,1)}
.track .mark::after{content:attr(data-n);position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:13px;font-weight:600;background:var(--ink);color:var(--sheet);padding:0 5px;border-radius:2px}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
.verdict{font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.04em}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.delta{font-family:var(--mono);font-size:12.5px;padding:3px 8px;border-radius:2px;border:1px solid var(--rule)}
.delta.up{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.delta.down{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.delta.st{color:var(--stamp);border-color:var(--stamp)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}

/* intro / end */
.passport{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:16px}
.passport dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.passport dd{margin:0}
.stampbox{display:flex;justify-content:center;padding:10px 0 4px}
.bigstamp{font-family:var(--mono);font-weight:600;font-size:clamp(22px,6vw,32px);letter-spacing:.16em;padding:10px 20px;border:4px double currentColor;border-radius:6px;transform:rotate(-5deg);animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both;text-align:center;line-height:1.2}
.bigstamp small{display:block;font-size:12px;letter-spacing:.12em}
@keyframes stamp{from{transform:rotate(-5deg) scale(1.8);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
.c-good{color:var(--good)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-stamp{color:var(--stamp)} .c-ink{color:var(--ink)}
.mrz{font-family:var(--mono);font-size:clamp(9.5px,2.4vw,13px);letter-spacing:.08em;background:var(--paper);border:1px solid var(--rule);padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.5}
.tally{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tally div{border:1px solid var(--rule);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tally b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.timeline li{display:grid;grid-template-columns:3.4em 1.4em 1fr;gap:6px;align-items:baseline}
.timeline .y{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.timeline .k{font-family:var(--mono);font-size:12px;font-weight:600}
.pp{display:flex;flex-direction:column;gap:6px}
.pprow{display:grid;grid-template-columns:7.5em 1fr 2.6em;gap:8px;align-items:center;font-family:var(--mono);font-size:12.5px}
.pprow .bar{height:10px}
.pprow .bar i{background:var(--muted)}
.pprow.me{font-weight:600;color:var(--stamp)}
.pprow.me .bar i{background:var(--stamp)}
.pprow .n{text-align:right;font-variant-numeric:tabular-nums}
.prompt{font-size:18px;font-style:italic}
.quadwrap{display:flex;flex-direction:column;gap:10px}
.quad{display:grid;grid-template-columns:4.8em minmax(0,1fr) minmax(0,1fr);gap:6px}
.quad .ax{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3}
.qcell{border:1.5px solid var(--rule);background:var(--sheet);border-radius:3px;padding:12px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:4.6em;min-width:0}
.qcell b{font-family:var(--display);font-size:clamp(13.5px,3.6vw,16px);line-height:1.15;overflow-wrap:anywhere}
.qcell small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.qcell:hover{border-color:var(--stamp)}
.qcell.sel{border-color:var(--stamp);background:var(--stamp-soft)}
.qcell.reading{box-shadow:inset 0 0 0 2px var(--good)}
.qout{font-size:15.5px;display:flex;flex-direction:column;gap:6px}
.qout .r{border-left:3px solid var(--good);padding-left:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const PROFILES={
syria:{name:"Rana",age:22,from:"Aleppo, Syria",code:"SYR",kind:"Forced to flee",weight:15,

 scenes:{

 balkan:{year:2015,place:"Lesbos → Munich",
  text:["Ferry to Athens, then buses, trains and long walks through North Macedonia, Serbia, Croatia, Hungary and Austria. Borders are open one week and fenced the next.","Twenty-three days after the boat, you arrive in Munich and ask for asylum."],

 permit:{year:2017,place:"Gaziantep",

  choices:[
   {label:"Take the job in Istanbul anyway",roll:{p:55,label:"You are not stopped at an ID check",
     win:{t:"You work in Istanbul for a year, quietly, and save more than in three years in Gaziantep. Then you go back before your luck runs out.",money:3000,next:"brother"},
     lose:{t:"Police check your ID on a ferry. You are detained for a week and sent back to Gaziantep. You hear of others who were taken to the Syrian border.",money:-300,safety:-20,next:"brother"}}},
   {label:"Stay in Gaziantep",t:"Less money, but you can walk to the market without your heart racing.",ties:5,next:"brother"}]},
 brother:{year:2021,place:"Gaziantep",
  text:["Your brother Omar is 15. A furniture workshop offers him 1,500 lira a week. He wants to help the family. Your mother wants him to finish school."],
  fact:"Hundreds of thousands of Syrian children in Turkey were out of school in the early 2020s, often because their families needed their wages. (UNICEF)",
  choices:[
   {label:"Keep Omar in school",t:"You take on extra shifts. Omar is bored and angry, but he passes his exams in Turkish.",money:-800,ties:5,flag:"omarSchool",next:"quake"},
   {label:"Let Omar go to work",t:"The family rent gets easier. Omar comes home with sawdust in his hair and stops talking about university.",money:1500,next:"quake"}]},
 quake:{year:2023,place:"Gaziantep, 6 February, 04:17",
  text:["Two earthquakes, magnitude 7.8 and 7.5, hit southern Turkey and northern Syria."],
  fact:"More than 50,000 people died in Turkey. The 11 affected provinces were home to over 1.7 million Syrians under temporary protection. (AFAD; UNHCR)",
  choices:[{label:"Hold on",roll:{p:60,label:"Your building stays standing",
     win:{t:"The walls crack but the building stands. You sleep in a car for three weeks.",safety:-10,next:"tension"},

 tension:{year:2023,place:"Gaziantep",
  text:["In the election campaign that spring, sending Syrians home is a promise made by several parties. Some neighbours stop speaking to your family."],
  fact:"Fewer than 1% of the world's refugees are resettled to a third country in a typical year. (UNHCR)",
  choices:[
   {label:"Apply for Turkish citizenship",roll:{p:s=>s.flags.job?30:10,label:"Your application is approved (better odds with formal work)",

     lose:{t:"No answer. You hear of families who have waited for years.",next:"fall"}}},
   {label:"Ask UNHCR to resettle you to another country",roll:{p:3,label:"You are selected for resettlement",
     win:{t:"Against all odds, Canada accepts your family for resettlement.",status:"Permanent resident · Canada",end:"resettled"},
     lose:{t:"Your file is registered. Nobody calls.",next:"fall"}}},
   {label:"Keep your head down and keep working",t:"You avoid speaking Arabic on the bus.",money:800,next:"fall"}]},
 fall:{year:2024,place:"Gaziantep, December",
  text:["On 8 December 2024 the Assad government falls. Turkey opens more border gates and lets Syrians make 'go-and-see' visits."],
  fact:"Hundreds of thousands of Syrians returned home from neighbouring countries in 2025, many to damaged houses and no work. (UNHCR)",
  choices:[
   {label:"Go back to Aleppo for good",end:"turReturn"},
   {label:"Stay in Turkey",end:"turStay"}]}
 },
 endings:{
  gerCitizen:{stamp:"CITIZEN",tone:"good",title:"German citizen",text:"You take the citizenship oath in 2025. With a German passport you can visit Aleppo and come back. Your Syrian passport opened about 27 countries without a visa; your German one opens about 190."},
  gerWait:{stamp:"PROTECTED",tone:"stamp",title:"Protected, for now",text:"Your permit is renewed. You are safe, but every renewal letter makes your hands shake. Germany warns that trips to Syria can cost refugees their protection status, so you stay."},
  gerReturn:{stamp:"BETWEEN",tone:"warn",title:"Between two countries",text:"You fly to Damascus in January. Your street in Aleppo has no electricity and your old flat has no roof. When you return to Germany, an official questions why someone in need of protection went back. Your case is reviewed."},
  resettled:{stamp:"RESETTLED",tone:"good",title:"Resettled to Canada",text:"You land in Winnipeg in winter. Resettlement is the rarest outcome in this game, and in real life: you were one of very few."},
  turReturn:{stamp:"RETURNED",tone:"ink",title:"Home, to a damaged city",text:"You go back to Aleppo in spring 2025. Your temporary protection in Turkey ends when you leave. Your nursing skills are needed: the hospital has power four hours a day."},
  turStay:{stamp:s=>s.flags.citizen?"CITIZEN":"TEMPORARY",tone:s=>s.flags.citizen?"good":"warn",title:s=>s.flags.citizen?"Turkish citizen":"Still 'temporary'",
   text:s=>s.flags.citizen?"You stay in Gaziantep. As a Turkish citizen you can visit Aleppo and return. Your parents, who never got citizenship, are under pressure to go back.":"You have lived in Turkey for over 11 years under protection called 'temporary'. Your Turkish is fluent. Your status is still not."}
 }},

nepal:{name:"Bikash",age:26,from:"Dhanusha, Nepal",code:"NPL",kind:"Labour migrant",weight:24,
 blurb:"Farmer's son, 26. Family debt, one brother already abroad.",
 start:{year:2018,money:200,safety:70,ties:80,status:"Citizen of Nepal"},
 prompt:"Nobody forced Bikash to leave. Was his migration voluntary? Where is the line between 'economic migrant' and someone with no real choice?",
 scenes:{
 start:{year:2018,place:"Dhanusha district",
  text:["Your family's land grows enough rice for eight months a year. Your father borrowed 300,000 rupees for your sister's wedding, and the interest grows every month. Your older brother works in Malaysia.","A local agent says a construction company in Qatar is hiring."],
  fact:"Money sent home by migrants equals about a quarter of Nepal's GDP. (World Bank)",
  choices:[
   {label:"Go to Qatar through the agent",tag:"Costs $1,100 in debt",t:"The agent charges 120,000 rupees (about $1,100), although Nepal's rules say employers should pay. You borrow it at 36% interest.",money:-1100,next:"kathmandu"},
   {label:"Cross into India and look for work in Delhi",t:"You take a bus to the border at Jaleshwar. Nobody asks for a passport.",next:"india"},
   {label:"Stay and farm another year",roll:{p:40,label:"A good harvest",
     win:{t:"The harvest is good, but it pays the interest, not the debt. A year later you go to the agent after all.",money:100,next:"kathmandu",fee:true},
     lose:{t:"The monsoon fails. The debt grows. A year later you go to the agent after all.",money:-200,next:"kathmandu",fee:true}}}]},
 kathmandu:{year:2019,place:"Kathmandu",
  text:["Medical check, a two-day pre-departure orientation, a labour permit sticker in your passport. At the airport the agent hands you your papers. Your job title says 'helper', not 'mason' as he promised."],
  fact:"Nepal requires workers to take an orientation course and get a labour permit before leaving. Agents often promise higher-paid job titles than the ones on the final visa.",
  choices:[
   {label:"Board the plane anyway",t:"You tell yourself a helper's wage is better than nothing.",next:"arrive"},
   {label:"Refuse and demand your money back",roll:{p:15,label:"The agent refunds you",
     win:{t:"After a week of arguing at his office, with a lawyer friend of your uncle's, he gives back 80%. You find a better agency and leave three months later.",money:900,next:"arrive",fee:true},
     lose:{t:"The agent stops answering your calls. With the loan to repay, you take the next flight he offers.",safety:-5,next:"arrive"}}}]},
 arrive:{year:2019,place:"Doha, Industrial Area",
  text:["You land at Hamad International Airport. The company keeps your passport 'for safekeeping'. You share a room with nine men."],
  fact:"Being handed a worse contract on arrival ('contract substitution') is widely documented for migrant workers in the Gulf. (ILO; Amnesty International)",
  choices:[{label:"Sign in at the company office",roll:{p:35,label:"The job and salary match what you were promised",
     win:{t:"Your salary is the 1,200 riyals (about $330) a month you were promised.",next:"heat"},
     lose:{t:"Your contract said 1,200 riyals a month. The new one says 900. You sign because you owe the loan.",flag:"cut",next:"heat"}}}]},
 heat:{year:2019,place:"Construction site, Lusail",
  text:["Ten-hour shifts. In summer the temperature reaches 45°C. Each month you decide how much to send home."],
  fact:"Qatar bans outdoor work in the middle of summer days. Researchers say heat stress is still a major health risk for migrant workers.",
  choices:[
   {label:"Send almost everything home",t:"Your family pays off a third of the loan in a year. You eat rice and lentils every day and lose 6 kg.",sent:2600,safety:-10,next:"covid"},
   {label:"Send half, keep half",t:"Your family pays the interest. You buy a phone to call home every night.",sent:1300,money:900,ties:5,next:"covid"}]},
 covid:{year:2020,place:"Doha, lockdown",
  text:["COVID-19. Part of the Industrial Area is sealed off. Your company stops paying wages for three months.","That summer Qatar changes the law: you can now change employer without your boss's permission."],
  fact:"In 2020 Qatar ended the rule that workers need their employer's permission to change jobs, and in 2021 it set a minimum wage for all workers. Rights groups say enforcement is uneven. (ILO)",
  choices:[
   {label:"Use the new law to move to another company",roll:{p:55,label:"The transfer goes through",
     win:{t:"You move to a facilities company. Wages arrive on time, and from 2021 you are covered by the minimum wage.",money:1500,sent:1500,next:"injury"},
     lose:{t:"Your old employer files an 'absconding' case against you. It takes four months to clear your name. No wages.",money:-400,safety:-10,next:"injury"}}},
   {label:"Stay and wait for your back pay",roll:{p:40,label:"Your wages are paid",
     win:{t:"The company pays all three months in one go.",money:1100,sent:600,next:"injury"},
     lose:{t:"You get one month's pay out of three. You cannot afford a lawyer.",money:300,next:"injury"}}}]},
 injury:{year:2021,place:"Doha",
  text:["Ramesh, who sleeps in the bunk above yours, does not wake up one morning. He was 31. The death certificate says 'cardiac arrest, natural causes'. His family in Jhapa receives no compensation.","A week later, carrying pipes in the afternoon heat, you feel dizzy."],
  fact:"Many deaths of young migrant workers in the Gulf are recorded as 'natural causes' without investigation, so families often receive no compensation. (ILO; Amnesty International)",
  choices:[
   {label:"Stop and go to the clinic",roll:{p:70,label:"Your supervisor lets you rest",
     win:{t:"The clinic gives you fluids and two days off. You come back more careful.",safety:-5,next:"visit"},
     lose:{t:"Your supervisor docks a day's pay for leaving the site. You go anyway.",money:-30,safety:-5,next:"visit"}}},
   {label:"Keep working to the end of the shift",roll:{p:60,label:"Nothing serious happens",
     win:{t:"You make it to the bus. That night your head pounds.",safety:-10,next:"visit"},
     lose:{t:"You collapse. You spend three days in hospital. Your kidneys are damaged.",safety:-30,money:-200,next:"visit"}}}]},
 visit:{year:2022,place:"Dhanusha, on leave",
  text:["Your first home leave in three years. Your parents have built a brick room with your money. Your mother has found a bride for you."],
  choices:[
   {label:"Get married on this trip",t:"The wedding costs more than you planned. You fly back to Doha a married man.",money:-800,ties:15,flag:"married",next:"cup"},
   {label:"Wait until you have saved more",t:"Your mother is disappointed. You promise to marry next time.",ties:-5,next:"cup"}]},
 cup:{year:2022,place:"Doha, after the World Cup",
  text:["The stadiums are finished and the tournament is over. Your contract ends next month."],
  fact:"Romania and Croatia became new destinations for Nepali workers after 2022. Agents charge high fees, and some offers are scams.",
  choices:[
   {label:"Go home to Dhanusha",end:"home"},
   {label:"Renew for two more years",t:"Two more summers.",sent:3000,safety:-5,end:"renew"},
   {label:"Pay an agent for a work permit in Europe",tag:"Costs $4,000",roll:{p:50,label:"The job in Europe is real",
     win:{t:"You get a work permit for a delivery company in Bucharest.",money:-4000,status:"Work permit · Romania",end:"europe"},
     lose:{t:"The agent disappears with your money.",money:-4000,end:"scam"}}}]},
 india:{year:2018,place:"Paharganj, Delhi",
  text:["No visa needed: a 1950 treaty lets Nepalis live and work in India. You wash dishes in a hotel kitchen for 9,000 rupees a month and sleep on the kitchen floor."],
  fact:"Because the Nepal–India border is open, no one knows exactly how many Nepalis work in India. Estimates run from hundreds of thousands to several million.",
  choices:[{label:"Keep working",t:"You send home what you can, which is not much.",sent:600,next:"india1b"}]},
 india1b:{year:2019,place:"Delhi",
  text:["A friend from your district offers you a job as a security guard in Gurgaon: better pay, 12-hour night shifts. A Nepali Gurkha regiment is also recruiting in India."],
  fact:"Under a 1947 agreement, Nepali citizens serve in the Indian Army's Gorkha regiments. Many Nepali families have served for generations.",
  choices:[
   {label:"Take the security guard job",t:"You guard an office tower at night. The pay is 14,000 rupees a month.",sent:900,money:300,next:"india2"},
   {label:"Try out for the Gorkha regiment",roll:{p:15,label:"You are selected",
     win:{t:"You pass the physical tests. You will start training next year.",money:500,next:"india2",flag:"army"},
     lose:{t:"You fail the run by eight seconds. You go back to the hotel kitchen.",next:"india2"}}}]},
 india2:{year:2020,place:"Delhi, March",
  text:["India announces a national lockdown with four hours' notice. The hotel closes. Trains and buses stop."],
  fact:"Millions of internal and cross-border migrant workers in India lost work overnight in March 2020; many walked hundreds of kilometres home.",
  choices:[{label:"Walk to the border",roll:{p:75,label:"You reach home safely",
     win:{t:"Nine days on foot and in the backs of lorries. You reach the border and wait two weeks in a quarantine camp.",safety:-10,end:"indiaHome"},
     lose:{t:"You collapse from heat and exhaustion on the road and spend a week in a clinic before you reach home.",safety:-25,end:"indiaHome"}}}]}
 },
 endings:{
  home:{stamp:"RETURNED",tone:"ink",title:s=>s.money+s.sent>3000?"Home, debt paid":"Home, still in debt",text:s=>s.money+s.sent>3000?"Your family's loan is paid off and the roof is new. You open a small phone shop in the bazaar. Your younger cousin asks you for the agent's number.":"You come home thinner, with the loan still not paid. Your younger cousin asks you for the agent's number anyway."},
  renew:{stamp:"RENEWED",tone:"warn",title:"Two more years",text:"You renew. Your daughter, born while you were away, is three before you see her in person. The house in Dhanusha now has a second floor."},
  europe:{stamp:"EUROPE",tone:"good",title:"Work permit in Romania",text:"You ride a delivery scooter through Bucharest winters. The pay is higher, but the agent's fee will take two years to repay. Some colleagues are already planning to move on to Portugal."},
  scam:{stamp:"SCAMMED",tone:"bad",title:"Back home, deeper in debt",text:"The 'work permit' never existed. You go home owing more than when you first left in 2018."},
  indiaHome:{stamp:"RETURNED",tone:"ink",title:"Back in the village",text:s=>s.flags.army?"You wait out the pandemic at home. In 2022 the Indian Army changes its recruitment rules and Nepal halts Gorkha recruitment. Your place is gone. You go to the agent for a job in Qatar after all.":"You are home, with no savings. In 2021 you go to the agent for a job in Qatar after all."}
 }},

philippines:{name:"Joy",age:29,from:"Iloilo City, Philippines",code:"PHL",kind:"Skilled worker",weight:16,
 blurb:"Staff nurse, 29. Married, one son. Half her class has already left.",
 start:{year:2019,money:1500,safety:85,ties:80,status:"Citizen of the Philippines"},
 prompt:"The UK gains a trained nurse; the Philippines paid for her training and loses her. Who should benefit from skilled migration, and should anyone compensate the country of origin?",
 scenes:{
 start:{year:2019,place:"Iloilo City",
  text:["You work 12-hour shifts as a staff nurse in a private hospital for about 15,000 pesos a month (under $300). Half your nursing class has already left the country.","A British recruiter is holding a job fair at a hotel in Manila."],
  fact:"The Philippines is one of the world's largest sources of nurses. About 2 million Filipinos work overseas, and remittances equal around 8–9% of GDP. (PSA; World Bank)",
  choices:[
   {label:"Apply for the NHS job in England",next:"exams"},
   {label:"Take a faster offer in Riyadh",t:"A Saudi hospital offers a tax-free salary about four times what you earn now, with housing. You fly in six weeks.",status:"Work visa · Saudi Arabia",next:"saudi0"},
   {label:"Stay and apply for a government hospital post",roll:{p:30,label:"You get the government post",
     win:{t:"You are hired at a public hospital, where a court ruling has nearly doubled nurses' starting pay.",money:1000,next:"phCovid"},
     lose:{t:"There are 400 applicants for 12 posts. You go to the NHS job fair after all.",next:"exams"}}}]},
 exams:{year:2019,place:"Manila",
  text:["Before you get a job offer you need an English test and the UK nursing council's computer exam."],
  choices:[{label:"Sit the exams",roll:{p:70,label:"You pass both the first time",
     win:{t:"You pass both. The hospital pays your visa and flight.",status:"Health & Care visa · UK",next:"arriveUK"},
     lose:{t:"You miss the writing score by half a band. You pay to retake the test and pass four months later.",money:-400,status:"Health & Care visa · UK",next:"arriveUK"}}}]},
 arriveUK:{year:2020,place:"A hospital in the English Midlands",
  text:["You land in February 2020. Your visa is tied to your employer. Until you pass a practical exam (the OSCE), you work as a care assistant on lower pay."],
  fact:"The Philippines and India are the largest sources of internationally recruited nurses in the UK's NHS. (NMC)",
  choices:[{label:"Take the OSCE",roll:{p:65,label:"You pass first time",
     win:{t:"You pass and get your registration number. You are a nurse again.",money:1500,next:"covidUK"},
     lose:{t:"You fail one station. The resit takes two months and £800 of your own money. You pass.",money:-500,next:"covidUK"}}}]},
 covidUK:{year:2020,place:"COVID ward, April",
  text:["COVID-19 arrives. You are moved to an intensive care ward after two weeks of training."],
  fact:"Filipino nurses made up a disproportionate share of NHS staff who died of COVID-19 in 2020.",
  choices:[{label:"Work through the first wave",roll:{p:85,label:"You stay healthy",
     win:{t:"You get through the first wave. A colleague from Cebu does not.",ties:-5,next:"ward"},
     lose:{t:"You are in hospital for ten days. Recovery takes months.",safety:-25,next:"ward"}}}]},
 ward:{year:2021,place:"Midlands",
  text:["A patient's son tells you he wants “a proper English nurse” for his father. Your manager is watching. A Band 6 post, a promotion, is coming up next month."],
  fact:"NHS staff surveys show that staff from ethnic minority backgrounds report more harassment and discrimination than white staff. (NHS Workforce Race Equality Standard)",
  choices:[
   {label:"Report the incident formally",roll:{p:55,label:"Your manager backs you",
     win:{t:"Your manager speaks to the family. You are shortlisted for the Band 6 post and get it.",money:2500,ties:5,next:"family"},
     lose:{t:"The complaint goes nowhere, and a colleague says you are 'difficult'. You don't get the promotion this time.",safety:-5,next:"family"}}},
   {label:"Let it go and swap patients",t:"You swap with a colleague and say nothing. Later you apply for the Band 6 post and get it.",money:2500,ties:-5,next:"family"}]},
 family:{year:2022,place:"Midlands",
  text:["Your contract says that if you leave in the first three years you repay £3,000 in training costs. Your husband and son are still in Iloilo."],
  fact:"A five-year UK visa for a family of three costs well over £10,000 once the Immigration Health Surcharge is included. (UK Home Office)",
  choices:[
   {label:"Bring your family over as dependants",t:"Visa fees and health surcharge take all your savings. Your son starts Year 4 at the local primary school.",money:-4500,ties:20,next:"mother"},
   {label:"Keep sending money home instead",t:"Your son grows up on video calls. Your family builds a concrete house.",sent:9000,ties:-10,next:"mother"}]},
 mother:{year:2024,place:"Midlands",
  text:["Your sister calls at 3 a.m.: your mother has had a stroke in Iloilo. Flights are £1,200. Your ward is short-staffed, and you've used most of your leave."],
  fact:"Migrant care workers often provide care in two countries at once: paid care where they work, and unpaid care for family at home. Researchers call this the 'global care chain'.",
  choices:[
   {label:"Fly home for three weeks, unpaid",t:"You hold your mother's hand in the hospital. She recognises you. Back in England, your savings are gone.",money:-2500,ties:15,next:"settle"},
   {label:"Stay and pay for a full-time carer",t:"You pay a carer from your wages and watch your mother's recovery on video calls.",sent:3000,ties:-10,next:"settle"}]},
 settle:{year:2025,place:"Midlands",
  text:["You reach five years in the UK, the point at which you can apply to settle permanently. In May 2025 the government proposes making most migrants wait ten years instead."],
  fact:"The UK's 2025 immigration white paper proposed raising the standard qualifying period for settlement from 5 to 10 years. Rules for some groups were still being decided.",
  choices:[{label:"Apply to settle",roll:{p:60,label:"You qualify before the rules change",
     win:{t:"Your Indefinite Leave to Remain is granted.",status:"Settled · UK",end:"settled"},
     lose:{t:"Your route is caught by the new rules. You must keep renewing your visa.",end:"waiting"}}}]},
 phCovid:{year:2020,place:"Iloilo, public hospital",
  text:["COVID-19 fills your ward. In April the Philippine government stops nurses from leaving the country to work abroad, so that they stay to fight the pandemic at home."],
  fact:"In 2020 the Philippines temporarily banned and then capped the deployment of nurses abroad, while many of its nurses were already working in foreign hospitals.",
  choices:[{label:"Work through the pandemic",roll:{p:80,label:"You stay healthy",
     win:{t:"Double shifts for months. Your hazard pay arrives a year late.",money:300,next:"phStay"},
     lose:{t:"You catch COVID and spend two weeks in your own hospital's isolation ward.",safety:-20,next:"phStay"}}}]},
 phStay:{year:2023,place:"Iloilo",
  text:["The ban is long gone. Your ward has lost eight nurses to the UK, the US and Saudi Arabia in a year. You now do the work of two people. A recruiter messages you again."],
  fact:"Philippine hospitals report serious nurse shortages, while the country remains one of the world's biggest exporters of nurses. (WHO; Philippine Nurses Association)",
  choices:[
   {label:"Stay: you are needed here",end:"stay"},
   {label:"Say yes this time",t:"You pass the exams and line up an NHS job, four years later than your classmates.",money:-400,status:"Health & Care visa · UK",end:"lateLeaver"}]},
 saudi0:{year:2020,place:"Riyadh",
  text:["You live in a staff compound with other Filipino nurses and need permission to leave it after dark. During the pandemic, flights home are cancelled for months. Your son's seventh birthday is on a video call."],
  fact:"Until recent reforms, the Gulf's kafala (sponsorship) system tied workers' visas to their employer, limiting their freedom to change jobs or leave the country.",
  choices:[
   {label:"Volunteer for the COVID ward for extra pay",roll:{p:80,label:"You stay healthy",
     win:{t:"Hazard pay doubles your savings this year.",money:4000,sent:2000,next:"saudi"},
     lose:{t:"You fall ill and spend two weeks in isolation, far from anyone you love.",money:1500,safety:-20,next:"saudi"}}},
   {label:"Stay on your regular ward",t:"Steady pay. You send money home every payday.",money:2000,sent:2000,next:"saudi"}]},
 saudi:{year:2022,place:"Riyadh",
  text:["Three years in. You have saved more than you could in a lifetime at home, but your contract does not let you bring your family, and you cannot become a resident for good."],
  fact:"Gulf states rarely offer migrant workers a path to permanent residence or citizenship, however long they stay.",
  choices:[
   {label:"Renew your contract",sent:12000,ties:-10,end:"saudiStay"},
   {label:"Use your savings and experience to move to the UK",t:"Your Gulf experience counts. You pass the UK exams and line up an NHS job.",money:6000,status:"Health & Care visa · UK",end:"ukNext"}]}
 },
 endings:{
  stay:{mob:{q:"voluntary",note:"Joy could have left, with good offers and a skill in demand, but she stayed."},stamp:"STAYED",tone:"ink",title:"Nurse at home",text:"You stay in Iloilo. Your ward is short of staff: every year more of your colleagues leave for the UK, the US or the Gulf."},
  settled:{stamp:"SETTLED",tone:"good",title:"Settled in the UK",text:"You can now stay in the UK for good. After another year you can apply for citizenship. Your mother asks if your niece can come too."},
  waiting:{stamp:"PENDING",tone:"warn",title:"Five more years",text:"You have lived and worked in the UK for five years, through a pandemic, and you still can't stay for good. You check the Home Office website every week."},
  lateLeaver:{stamp:"ONWARD",tone:"stamp",title:"Leaving, late",text:"You land in England in 2024. Your old ward in Iloilo is short another nurse. You stayed when it was hardest, and you leave now because you have to think about your son's future too."},
  ukNext:{stamp:"ONWARD",tone:"stamp",title:"Second move: England",text:"You land in England in 2023 with savings and four years of Gulf experience. Many nurses move in steps like this, and each country along the way sets different rules about family and settlement. Your five-year count towards settling in the UK starts now."},
  saudiStay:{stamp:"RENEWED",tone:"warn",title:"Another contract in Riyadh",text:"Your savings built your parents' house. Your son is twelve. You plan to go home 'in two years', as you have for six years."}
 }},

venezuela:{name:"Daniel",age:31,from:"Maracaibo, Venezuela",code:"VEN",kind:"Displaced across borders",weight:15,
 blurb:"Physics teacher, 31. Wife and a two-year-old daughter.",
 start:{year:2018,money:150,safety:45,ties:75,status:"Citizen of Venezuela"},
 prompt:"Most Venezuelans who left do not fit the legal definition of a refugee, but they could not stay. Should the refugee definition be wider? What did Colombia's temporary protection do that asylum could not?",
 scenes:{
 start:{year:2018,place:"Maracaibo",
  text:["You teach physics at a high school. Your monthly salary buys about one kilo of cheese. Prices double every few weeks. Your daughter's medicine is not in any pharmacy."],
  fact:"About 7.9 million Venezuelans have left the country since 2014, one of the largest displacements in the world. (R4V, 2024)",
  choices:[
   {label:"Try to get passports and fly to Lima",roll:{p:15,label:"The passport office issues your passports",

     lose:{t:"Months of waiting and no passports. You take the bus to the border with your ID cards.",next:"cucuta"}}},
   {label:"Take the bus to the Colombian border",next:"cucuta"}]},
 cucuta:{year:2018,place:"Simón Bolívar bridge, Cúcuta",
  text:["Tens of thousands cross the bridge on foot every day. Many keep walking 500 km to Bogotá, over a cold mountain pass. You have no Colombian permit."],
  choices:[
   {label:"Walk to Bogotá with your family",roll:{p:80,label:"Your family arrives without serious harm",

bangladesh:{name:"Shahida",age:34,from:"Sirajganj, Bangladesh",code:"BGD",kind:"Displaced by climate (internal)",weight:20,

 scenes:{

  choices:[
